# Builds our OpenTodo image: upstream release + patches/opentodo/*.py applied.
#
# Why here and not a fork: the App installation cannot create repositories or
# forks, and a fork means carrying a merge conflict on every upstream release.
# This builds a clean upstream checkout at the tag, applies our patches, and
# pushes the result. Bumping = one dispatch with a new tag; if a patch no longer
# applies, the build fails instead of quietly shipping an unpatched image.
#
# Image: ghcr.io/slamanna212/homelabargocd/opentodo:<tag>-sam.<rev>
# GITHUB_TOKEN may only push images named after this repository, hence the
# homelabargocd path segment. The package must be public (or given a pull secret)
# for the cluster to pull it.

name: opentodo image

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream release tag without the v, e.g. 0.22.0"
        required: true
        default: "0.22.0"
      revision:
        description: "Our rebuild number for that tag"
        required: true
        default: "1"

permissions:
  contents: read
  packages: write

concurrency:
  group: opentodo-image-${{ inputs.upstream_tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream at v${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "v${{ inputs.upstream_tag }}" \
            https://github.com/OpenTodoApp/OpenTodo.git src
          git -C src rev-parse --short HEAD

      - name: Apply our patches
        run: |
          set -euo pipefail
          for patch in patches/opentodo/*.py; do
            echo "== $patch"
            python3 "$patch" src
          done
          git -C src diff --stat

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: src
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ghcr.io/slamanna212/homelabargocd/opentodo:${{ inputs.upstream_tag }}-sam.${{ inputs.revision }}
          build-args: |
            VERSION=${{ inputs.upstream_tag }}-sam.${{ inputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
