# kube-prometheus-stack Helm values
# Homelab cluster: 3 control-plane + 4 worker nodes
# Cilium CNI (replaces kube-proxy)

# -- Prometheus --
prometheus:
  prometheusSpec:
    retention: 20d
    retentionSize: 26GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-sata
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 30Gi
    # Discover ServiceMonitors/PodMonitors across all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}

# -- Grafana --
grafana:
  admin:
    existingSecret: grafana-admin-secret
    passwordKey: admin-password
  defaultDashboardsTimezone: America/New_York
  defaultDashboardsEnabled: true
  initChownData:
    enabled: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    runAsGroup: 472
    fsGroup: 472
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    storageClassName: longhorn-sata
    size: 5Gi
  sidecar:
    dashboards:
      searchNamespace: ALL
    alerts:
      enabled: true
      searchNamespace: ALL
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
      uid: loki

# -- Alertmanager --
alertmanager:
  alertmanagerSpec:
    configSecret: alertmanager-discord-config
    replicas: 2
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-sata
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

# -- node-exporter --
nodeExporter:
  enabled: true

# -- kube-state-metrics --
kubeStateMetrics:
  enabled: true

kube-state-metrics:
  replicas: 1
  prometheus:
    monitor:
      relabelings:
        - targetLabel: cluster
          replacement: homelab

# -- Kubelet scraping --
kubelet:
  serviceMonitor:
    relabelings:
      - action: replace
        sourceLabels:
          - __metrics_path__
        targetLabel: metrics_path
      - targetLabel: cluster
        replacement: homelab
    cAdvisorRelabelings:
      - action: replace
        sourceLabels:
          - __metrics_path__
        targetLabel: metrics_path
      - targetLabel: cluster
        replacement: homelab
    probesRelabelings:
      - action: replace
        sourceLabels:
          - __metrics_path__
        targetLabel: metrics_path
      - targetLabel: cluster
        replacement: homelab

# -- Cilium-aware settings --
kubeProxy:
  enabled: false

defaultRules:
  rules:
    kubeProxy: false
