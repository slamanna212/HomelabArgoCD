# Loki Helm values
# Monolithic (SingleBinary) mode for homelab scale

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    retention_period: 14d
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  # NOTE: the chart reads ruler config from `loki.rulerConfig` (renders via the
  # loki.rulerConfig template). A `loki.ruler` block is silently ignored.
  rulerConfig:
    wal:
      dir: /var/loki/ruler-wal
    storage:
      type: local
      local:
        directory: /rules
    rule_path: /tmp/loki-rules
    alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
    enable_api: true
    enable_alertmanager_v2: true

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: longhorn-sata
    size: 20Gi
  # Mount the Loki alert rules ConfigMap into the ruler's local storage dir.
  # auth_enabled=false => tenant "fake", so rules must live at /rules/fake/.
  # Repointed 2026-09-21: the old loki-vpn-rules ConfigMap was deleted with
  # 1cffad0 (UniFi VPN Loki alerts retired for metric-based rules), so every
  # loki-0 pod restart failed at volume setup with "configmap not found".
  extraVolumes:
    - name: gluetun-rules
      configMap:
        name: loki-gluetun-rules
  extraVolumeMounts:
    - name: gluetun-rules
      mountPath: /rules/fake

# Disable distributed-mode components
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Disable unnecessary sub-charts and features
gateway:
  enabled: false
monitoring:
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: false
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack

lokiCanary:
  enabled: false
test:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
