# Promtail Helm values
# Ships all container logs to Loki

config:
  clients:
    - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

  snippets:
    extraScrapeConfigs: |
      - job_name: unifi-syslog
        syslog:
          listen_address: 0.0.0.0:1514
          idle_timeout: 60s
          label_structured_data: true
          labels:
            job: unifi-syslog
        relabel_configs:
          - source_labels: [__syslog_message_hostname]
            target_label: host
          - source_labels: [__syslog_message_app_name]
            target_label: app
        pipeline_stages:
          - match:
              selector: '{job="unifi-syslog"} |~ "(?i)wireguard"'
              stages:
                - regex:
                    expression: 'wireguard: \[(?P<interface>[^\]]+)\] peer\((?P<peer>[^)]+)\): (?P<event>.+)'
                - labels:
                    interface:
                    peer:
                    event:

extraPorts:
  - name: syslog-udp
    containerPort: 1514
    protocol: UDP
