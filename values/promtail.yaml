# Promtail Helm values
# Ships all container logs to Loki

config:
  clients:
    - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

  snippets:
    extraScrapeConfigs: |
      # Scrape the syslog-ng pod so its logs land in Loki as job=network-syslog.
      # syslog-ng accepts UDP syslog from any device (UniFi, routers, switches, VMs, etc.)
      # Query in Grafana: {job="network-syslog"} — filter by host/app labels for specific devices.
      - job_name: network-syslog
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - monitoring
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: syslog-ng
            action: keep
          - replacement: network-syslog
            target_label: job
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            regex: (.+)/(.+)
            target_label: __path__
            replacement: /var/log/pods/*$1*/$2/*.log
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Pending|Succeeded|Failed|Completed
            action: drop
        pipeline_stages:
          - cri: {}
