# OpenViking — context database backing Hermes' long-term memory (internal-only).
#
# This is a SINGLE-USER, in-cluster deployment whose only consumer is the Hermes
# agent (memory.provider=openviking). No MetalLB, no Traefik/IngressRoute: the
# gateway and WebUI pods talk to it directly over the cluster service network via
# ClusterIP, exactly like the firecrawl extractor. Keeping it internal means the
# root API key stays a cluster-local guard, not a LAN-exposed credential.
#
# Choices worth knowing:
#   * image: official ghcr.io/volcengine/openviking, pinned to a real release
#     tag (v0.4.13). chart default :latest is non-reproducible.
#   * replicaCount must stay 1 (RocksDB + byte-range lock over one PVC, single
#     writer) — the chart hard-fails if you raise it.
#   * bot (VikingBot) disabled — k8s chart default; we only need the API server.
#   * persistence: Longhorn RWO PVC, one mount for /app/.openviking (ov.conf,
#     ovcli.conf, and all workspace/vectordb data). K8up backs it up daily.
#   * embedding: qwen/qwen3-embedding-8b (4096-dim) via OpenRouter — the exact
#     OpenViking-supported OpenAI-compatible path. encoding_format=float because
#     OpenRouter can't always deserialize base64 embeddings.
#   * vlm: deepseek-v4-flash (V4 Flash 0731 build) via DeepSeek DIRECT
#     (api.deepseek.com) for rich-context summarization — cheaper than
#     gemini-2.5-flash-lite via OpenRouter (no OR markup). VLM is optional for
#     Hermes memory ops but useful.
#   * secrets: all API keys come from Azure Key Vault via ExternalSecret
#     (manifests/openviking/external-secret.yaml), injected as env, and the
#     ${OPENVIKING_ROOT_API_KEY} / ${OPENROUTER_API_KEY} / ${DEEPSEEK_API_KEY}
#     placeholders in ov.conf are expanded by OpenViking's config loader from
#     those env vars — no secret value ever lands in the ConfigMap or git.

replicaCount: 1

image:
  repository: ghcr.io/volcengine/openviking
  tag: "v0.4.13"
  pullPolicy: IfNotPresent

# Service name -> openviking.openviking.svc.cluster.local:1933
fullnameOverride: openviking

service:
  type: ClusterIP
  port: 1933

bot:
  enabled: false

persistence:
  enabled: true
  storageClass: longhorn
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /app/.openviking

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

# OpenViking server config (rendered to the ov.conf ConfigMap). empty
# storage.workspace -> chart defaults it to /app/.openviking/openviking_workspace.
config:
  log:
    level: INFO
    output: stdout
  server:
    host: "0.0.0.0"
    port: 1933
    workers: 1
    # Internal-only ClusterIP service whose only consumer is Hermes. On a
    # network-reachable host OpenViking ALWAYS requires root_api_key (dev is
    # refused and trusted demands a key on non-localhost — security guard).
    # So: trusted mode + root_api_key present. Hermes sends that root key as
    # OPENVIKING_API_KEY in its .env; OpenViking derives account/user identity
    # from the key, so no separate user key is needed. root_api_key here
    # satisfies the non-localhost boot requirement only.
    auth_mode: "trusted"
    root_api_key: "${OPENVIKING_ROOT_API_KEY}"
    cors_origins:
      - "*"
  storage:
    workspace: ""
    vectordb:
      name: context
      backend: local
      project: default
    agfs:
      backend: local
      timeout: 10
  embedding:
    max_concurrent: 4
    max_retries: 3
    text_source: content_only
    max_input_tokens: 4096
    dense:
      provider: openai
      api_key: "${OPENROUTER_API_KEY}"
      api_base: "https://openrouter.ai/api/v1"
      model: "qwen/qwen3-embedding-8b"
      dimension: 4096
      encoding_format: "float"
      input: "text"
  vlm:
    provider: openai
    api_key: "${DEEPSEEK_API_KEY}"
    api_base: "https://api.deepseek.com/v1"
    model: "deepseek-v4-flash"
    temperature: 0.0
    max_retries: 2
    max_concurrent: 4

# Secrets pulled from Key Vault (see manifests/openviking/external-secret.yaml)
# and exposed to the config-loader's ${...} expansion.
extraEnv:
  - name: OPENVIKING_ROOT_API_KEY
    valueFrom:
      secretKeyRef:
        name: openviking-secrets
        key: root-api-key
  - name: OPENROUTER_API_KEY
    valueFrom:
      secretKeyRef:
        name: openviking-secrets
        key: openrouter-api-key
  - name: DEEPSEEK_API_KEY
    valueFrom:
      secretKeyRef:
        name: openviking-secrets
        key: deepseek-api-key
