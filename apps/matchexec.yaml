apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: matchexec
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: ghcr.io/slamanna212/charts
      chart: matchexec
      targetRevision: "0.8.1"
      helm:
        valueFiles:
          - $values/values/matchexec.yaml
    - repoURL: https://github.com/slamanna212/HomelabArgoCD.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/slamanna212/HomelabArgoCD.git
      targetRevision: main
      path: manifests/matchexec
  destination:
    server: https://kubernetes.default.svc
    namespace: matchexec
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
