apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openviking
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # OpenViking's official Helm chart lives in its source repo (not a chart
    # repo/URL), so this is a git-path Helm source — same pattern as firecrawl.
    - repoURL: https://github.com/volcengine/OpenViking.git
      targetRevision: v0.4.13
      path: deploy/helm/openviking
      helm:
        valueFiles:
          - $values/values/openviking.yaml
    # Values overlay lives in this repo, referenced as $values above.
    - repoURL: https://github.com/slamanna212/HomelabArgoCD.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: openviking
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true