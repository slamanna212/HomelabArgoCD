apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: firecrawl
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Firecrawl's official Helm chart lives in its source repo (not a chart
    # repo/URL), so this is a git-path Helm source. The chart deploys the API,
    # workers, Playwright, Redis, RabbitMQ, and NuQ Postgres.
    - repoURL: https://github.com/firecrawl/firecrawl.git
      targetRevision: v2.11.263
      path: examples/kubernetes/firecrawl-helm
      helm:
        valueFiles:
          - $values/values/firecrawl.yaml
    # Values overlay lives in this repo, referenced as $values above.
    - repoURL: https://github.com/slamanna212/HomelabArgoCD.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: firecrawl
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true