apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: celeste
  namespace: argocd
  annotations:
    # Must sync after the CloudNativePG operator and External Secrets (CRDs).
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # OCI Helm chart in GHCR; ArgoCD omits the oci:// prefix. Public package, no repo registration.
    - repoURL: ghcr.io/slamanna212/charts
      chart: celeste
      targetRevision: "0.1.7"
      helm:
        valueFiles:
          - $values/values/celeste.yaml
    - repoURL: https://github.com/slamanna212/HomelabArgoCD.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: celeste
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
