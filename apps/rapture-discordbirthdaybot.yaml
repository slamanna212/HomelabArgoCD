apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rapture-discordbirthdaybot
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set
      targetRevision: "0.14.1"
      helm:
        valueFiles:
          - $values/values/rapture-discordbirthdaybot.yaml
    - repoURL: https://github.com/slamanna212/HomelabArgoCD.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  ignoreDifferences:
    - group: actions.github.com
      kind: AutoscalingRunnerSet
      jsonPointers:
        - /metadata/annotations/actions.github.com~1change-hash
        - /metadata/annotations/actions.github.com~1values-hash
        - /metadata/annotations/runner-scale-set-id
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
