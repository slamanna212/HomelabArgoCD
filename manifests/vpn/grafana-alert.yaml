apiVersion: v1
kind: ConfigMap
metadata:
  name: wireguard-vpn-alert
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  wireguard-vpn-alert.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: VPN Alerts
        folder: VPN
        interval: 1m
        rules:
          - uid: wireguard-login
            title: WireGuard VPN Login
            condition: A
            data:
              - refId: A
                relativeTimeRange:
                  from: 120
                  to: 0
                datasourceUid: loki
                model:
                  datasource:
                    type: loki
                    uid: loki
                  editorMode: code
                  expr: 'sum by (client, src) (count_over_time({job="network-syslog"} |~ "VPN Client Connected" |~ "wireguard-server" | pattern `<_>src=<src> suser=<client> UNIFI<_>` [2m]))'
                  instant: true
                  queryType: instant
                  refId: A
            noDataState: OK
            execErrState: Alerting
            for: 0s
            annotations:
              summary: WireGuard VPN client connected
              description: '{{ $labels.client }} connected to WireGuard VPN from {{ $labels.src }}'
            labels:
              severity: warning

          - uid: wireguard-disconnect
            title: WireGuard VPN Disconnect
            condition: A
            data:
              - refId: A
                relativeTimeRange:
                  from: 120
                  to: 0
                datasourceUid: loki
                model:
                  datasource:
                    type: loki
                    uid: loki
                  editorMode: code
                  expr: 'sum by (client, duration, usage_down, usage_up) (count_over_time({job="network-syslog"} |~ "VPN Client Disconnected" |~ "wireguard-server" | pattern `<_>suser=<client> UNIFIduration=<duration> UNIFIusageDown=<usage_down> UNIFIusageUp=<usage_up> UNIFI<_>` [2m]))'
                  instant: true
                  queryType: instant
                  refId: A
            noDataState: OK
            execErrState: Alerting
            for: 0s
            annotations:
              summary: WireGuard VPN client disconnected
              description: '{{ $labels.client }} disconnected. Duration: {{ $labels.duration }}. Data: {{ $labels.usage_down }} down / {{ $labels.usage_up }} up'
            labels:
              severity: info
