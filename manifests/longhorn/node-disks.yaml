# Declaratively manage Longhorn per-node disk layout.
# Added after Apr 2026 incident: an extra disk entry at /var/lib/longhorn-sata on
# work03v conflicted by filesystem UUID ("DiskFilesystemChanged") and blocked
# replica scheduling. GitOps-managing Node disks prevents UI drift from recurring.
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: slama-read-k8work01v
  namespace: longhorn-system
spec:
  allowScheduling: true
  disks:
    default-disk-147f840f96f65d7f:
      path: /var/lib/longhorn
      allowScheduling: true
      storageReserved: 44462050099
      tags: []
    # 2026-09-17: draining this disk. /proc/diskstats sampling showed sustained
    # write-latency degradation (~114 writes / 30s at ~2.5s avg, 6-22 I/Os
    # permanently in flight, queue never drains). No SMART data (QEMU virtual
    # disk) and no kernel I/O errors yet - pre-failure, not hard failure.
    #
    # NOTE: the sampled device was /dev/sdb, but this mount is NOT confirmed to
    # be that device. HomelabAnsible host_vars/slama-read-k8work01v.yml sets
    # `longhorn_sata_disk: sda` for this node (the role default is sdb), and the
    # prep role mounts by filesystem UUID, so device letters are not
    # authoritative here. Confirm with `findmnt -no SOURCE /var/lib/longhorn-sata`
    # on the node before relying on this. If it resolves to something other than
    # sdb, the degradation is on a different disk and this eviction is aimed at
    # the wrong one.
    #
    # Replicas evict to the sata disks on work03v/work04v. Revert both fields to
    # `allowScheduling: true` (drop evictionRequested) once resolved, or ArgoCD
    # selfHeal keeps the disk permanently in eviction and replicas can't return.
    longhorn-sata:
      path: /var/lib/longhorn-sata
      allowScheduling: false
      evictionRequested: true
      storageReserved: 10737418240
      tags: ["sata"]
---
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: slama-read-k8work03v
  namespace: longhorn-system
spec:
  allowScheduling: true
  disks:
    default-disk:
      path: /var/lib/longhorn
      allowScheduling: true
      storageReserved: 29581587251
      tags: []
    longhorn-sata:
      path: /var/lib/longhorn-sata
      allowScheduling: true
      storageReserved: 10737418240
      tags: ["sata"]
---
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: slama-read-k8work04v
  namespace: longhorn-system
spec:
  allowScheduling: true
  disks:
    default-disk-74eb479e46641828:
      path: /var/lib/longhorn
      allowScheduling: true
      storageReserved: 29586629836
      tags: []
    longhorn-sata:
