# Declaratively manage Longhorn per-node disk layout.
# Added after Apr 2026 incident: an extra disk entry at /var/lib/longhorn-sata on
# work03v conflicted by filesystem UUID ("DiskFilesystemChanged") and blocked
# replica scheduling. GitOps-managing Node disks prevents UI drift from recurring.
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: slama-read-k8work01v
  namespace: longhorn-system
spec:
  allowScheduling: true
  disks:
    default-disk-147f840f96f65d7f:
      path: /var/lib/longhorn
      allowScheduling: true
      storageReserved: 44462050099
      tags: []
    # 2026-09-17: draining this disk. /dev/sdb shows sustained write-latency
    # degradation (~114 writes / 30s at ~2.5s avg, 6-22 I/Os permanently in
    # flight, queue never drains) via /proc/diskstats sampling. No SMART data
    # (QEMU virtual disk) and no kernel I/O errors yet - pre-failure, not hard
    # failure. Replicas evict to the sata disks on work03v/work04v. Revert both
    # fields to `allowScheduling: true` (drop evictionRequested) once the
    # underlying disk is replaced and re-verified.
    longhorn-sata:
      path: /var/lib/longhorn-sata
      allowScheduling: false
      evictionRequested: true
      storageReserved: 10737418240
      tags: ["sata"]
---
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: slama-read-k8work03v
  namespace: longhorn-system
spec:
  allowScheduling: true
  disks:
    default-disk:
      path: /var/lib/longhorn
      allowScheduling: true
      storageReserved: 29581587251
      tags: []
    longhorn-sata:
      path: /var/lib/longhorn-sata
      allowScheduling: true
      storageReserved: 10737418240
      tags: ["sata"]
---
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: slama-read-k8work04v
  namespace: longhorn-system
spec:
  allowScheduling: true
  disks:
    default-disk-74eb479e46641828:
      path: /var/lib/longhorn
      allowScheduling: true
      storageReserved: 29586629836
      tags: []
    longhorn-sata:
      path: /var/lib/longhorn-sata
      allowScheduling: true
      storageReserved: 10737418240
      tags: ["sata"]
