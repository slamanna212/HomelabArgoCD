apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: unpoller
  namespace: unpoller
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: unpoller
      component: metrics
  namespaceSelector:
    matchNames:
      - unpoller
  endpoints:
    - port: metrics
      path: /metrics
