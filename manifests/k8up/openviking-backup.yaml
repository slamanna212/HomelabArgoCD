apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: b2-credentials
  namespace: openviking
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: b2-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: keyId
      remoteRef:
        key: b2-key-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: appKey
      remoteRef:
        key: b2-app-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: resticPassword
      remoteRef:
        key: b2-restic-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: openviking-backup
  namespace: openviking
spec:
  backend:
    repoPasswordSecretRef:
      name: b2-credentials
      key: resticPassword
    s3:
      endpoint: https://s3.us-east-005.backblazeb2.com
      bucket: rapturek8up/openviking
      accessKeyIDSecretRef:
        name: b2-credentials
        key: keyId
      secretAccessKeySecretRef:
        name: b2-credentials
        key: appKey
  backup:
    schedule: "0 2 * * *"
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 0
  check:
    schedule: "0 3 * * 0"
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 0
  prune:
    schedule: "0 4 * * 0"
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 0
    retention:
      keepLast: 7
      keepWeekly: 4