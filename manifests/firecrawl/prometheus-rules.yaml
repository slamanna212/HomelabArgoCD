apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: firecrawl-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: firecrawl.service
      rules:
        # Firecrawl is Hermes' web_extract backend: when it is not ready, page
        # extraction fails. The probe checks HTTP 2xx AND the {"status":"ok"} body.
        #
        # probe_success alone is not enough: it only exists when the exporter
        # completed a probe, so a missing Probe/blackbox outage would make the
        # expression empty and silently resolve the alert. Cover all three states:
        # probe returned failure, scrape target down, and series entirely absent.
        - alert: FirecrawlUnavailable
          expr: |
            probe_success{job="firecrawl-readiness"} == 0
            or
            up{job="firecrawl-readiness"} == 0
            or
            absent(up{job="firecrawl-readiness"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Firecrawl extractor is not ready"
            description: "Firecrawl readiness probe (job firecrawl-readiness) has been failing, unreachable, or absent for more than 5 minutes. Hermes web_extract (extract_backend=firecrawl) will fail."

        # Covers every Deployment in the namespace (api, worker, nuq workers,
        # nuq-prefetch, playwright, rabbitmq, redis, nuq-postgres) — any of them
        # being down degrades scraping, not just the API.
        - alert: FirecrawlDeploymentUnavailable
          expr: kube_deployment_status_replicas_unavailable{namespace="firecrawl"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Firecrawl deployment has unavailable replicas"
            description: "Deployment {{ $labels.deployment }} in namespace firecrawl has {{ $value }} unavailable replica(s) for more than 10 minutes."

        - alert: FirecrawlPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="firecrawl"}[30m]) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Firecrawl pod is restarting"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} restarted more than twice in the last 30 minutes."
