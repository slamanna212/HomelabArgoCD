apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openviking-secrets
  namespace: openviking
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: openviking-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Reuse the existing OpenRouter key already in Key Vault (same value the
    # Hermes agent uses for embeddings + VLM). No new KV secret needed for this.
    - secretKey: openrouter-api-key
      remoteRef:
        key: hermes-openrouter-api-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # OpenViking's root API key (required by the server on 0.0.0.0). Value must
    # be added to Key Vault as `openviking-root-api-key` before the pod starts.
    - secretKey: root-api-key
      remoteRef:
        key: openviking-root-api-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None