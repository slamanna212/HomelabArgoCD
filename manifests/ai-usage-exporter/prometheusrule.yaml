        - alert: AIBalanceLow
          expr: ai_credits_remaining{provider=~"openrouter|deepseek"} < 2
          for: 15m
          labels:
            severity: warning
            app: ai-usage-exporter
          annotations:
            summary: "{{ $labels.provider }} prepaid balance below $2"
            description: "{{ $labels.provider }} has {{ $value | humanize }} credits remaining."