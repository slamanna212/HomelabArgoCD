apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ai-usage-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: ai-usage
      rules:
        # NOTE: the collector runs on Sam's desktop (where Claude/Codex OAuth
        # credentials stay fresh). "Down" is expected when the machine sleeps,
        # so there is intentionally no collector-down page. Staleness is the
        # signal instead (24h threshold below).
        - alert: AIExporterUnreachable
          expr: up{job="ai-usage-desktop"} == 0
          for: 1h
          labels:
            severity: warning
            app: ai-usage-exporter
          annotations:
            summary: "AI usage exporter unreachable"
            description: "Prometheus cannot reach the desktop collector for 1 hour. If the machine is awake, check the exporter service and firewall (TCP 9100)."

        - alert: AICreditsLow
          expr: ai_usage_used_percent >= 80
          for: 10m
          labels:
            severity: warning
            app: ai-usage-exporter
          annotations:
            summary: "{{ $labels.provider }} {{ $labels.window }} usage at {{ $value | humanize }}%"
            description: "{{ $labels.provider }} {{ $labels.window }} allowance is {{ $value | humanize }}% used. Reset is due soon; pace usage accordingly."

        - alert: AICreditsCritical
          expr: ai_usage_used_percent >= 95
          for: 5m
          labels:
            severity: critical
            app: ai-usage-exporter
          annotations:
            summary: "{{ $labels.provider }} {{ $labels.window }} usage at {{ $value | humanize }}%"
            description: "{{ $labels.provider }} {{ $labels.window }} allowance is {{ $value | humanize }}% used. The window will be exhausted imminently."

        - alert: AIQuotaExhausted
          expr: ai_usage_used_percent >= 100 or ai_usage_remaining_percent <= 0
          for: 2m
          labels:
            severity: critical
            app: ai-usage-exporter
          annotations:
            summary: "{{ $labels.provider }} {{ $labels.window }} allowance exhausted"
            description: "{{ $labels.provider }} has fully exhausted its {{ $labels.window }} allowance. Requests will be rate-limited until the window resets."

        - alert: AIBalanceLow
          expr: ai_credits_remaining{provider=~"openrouter|deepseek"} < 10
          for: 15m
          labels:
            severity: warning
            app: ai-usage-exporter
          annotations:
            summary: "{{ $labels.provider }} prepaid balance below $10"
            description: "{{ $labels.provider }} has ${{ $value }} prepaid credits remaining. Top up before it runs dry."

        - alert: AIBalanceExhausted
          expr: ai_credits_remaining{provider=~"openrouter|deepseek"} <= 0
          for: 5m
          labels:
            severity: critical
            app: ai-usage-exporter
          annotations:
            summary: "{{ $labels.provider }} prepaid balance exhausted"
            description: "{{ $labels.provider }} has ${{ $value }} credits remaining. API calls will start failing."

        - alert: AIProviderFetchFailed
          expr: ai_provider_up == 0
          for: 30m
          labels:
            severity: warning
            app: ai-usage-exporter
          annotations:
            summary: "{{ $labels.provider }} usage fetch failing"
            description: "codexbar cannot fetch {{ $labels.provider }} usage. On the desktop: run 'codexbar usage --provider {{ $labels.provider }} --verbose' to see why. Usually an expired local session (rare — CLI use refreshes it) or a bad API key."

        - alert: AIUsageStale
          expr: (time() - ai_provider_updated_timestamp) > 86400 and ai_provider_up == 1
          for: 30m
          labels:
            severity: warning
            app: ai-usage-exporter
          annotations:
            summary: "{{ $labels.provider }} usage data is stale"
            description: "{{ $labels.provider }} last reported {{ $value | humanizeDuration }} ago (over 24h). The desktop collector may be off or the provider API is degraded."
