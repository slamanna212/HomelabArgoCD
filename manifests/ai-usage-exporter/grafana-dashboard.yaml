              "editorMode": "code",
              "expr": "ai_usage_used_percent{provider=\"claude\"}",
              "legendFormat": "claude {{window}}",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "ai_usage_used_percent{provider=\"codex\"}",
              "legendFormat": "codex {{window}}",
              "range": true,
              "refId": "B"
