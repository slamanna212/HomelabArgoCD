apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ai-usage-exporter
  namespace: hermes
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: ai-usage-exporter
      component: metrics
  namespaceSelector:
    matchNames:
      - hermes
  endpoints:
    - port: metrics
      path: /metrics
      interval: 5m
      scrapeTimeout: 30s
