apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: codexbar
  namespace: ai-monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: codexbar-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        config.json: |
          {
            "version": 1,
            "providers": [
              {
                "id": "claude",
                "enabled": true,
                "source": "oauth"
              },
              {
                "id": "codex",
                "enabled": true,
                "source": "oauth"
              },
              {
                "id": "openrouter",
                "enabled": true,
                "source": "api",
                "apiKey": "{{ .openrouterApiKey }}"
              },
              {
                "id": "deepseek",
                "enabled": true,
                "source": "api",
                "apiKey": "{{ .deepseekApiKey }}"
              }
            ]
          }
  data:
    - secretKey: openrouterApiKey
      remoteRef:
        key: ai-monitor-openrouter-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: deepseekApiKey
      remoteRef:
        key: ai-monitor-deepseek-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
---
# OAuth credential files for Claude/Codex subscription usage (not API-key
# based). Values are the full contents of:
#   ~/.claude/.credentials.json  (Claude Code OAuth session)
#   ~/.codex/auth.json           (Codex/ChatGPT OAuth session)
# Both expire periodically; refresh by updating the KeyVault values and
# restarting the deployment (ExternalSecret re-syncs hourly).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: codexbar-credentials
  namespace: ai-monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: codexbar-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: claude-credentials
      remoteRef:
        key: ai-monitor-claude-credentials
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: codex-auth
      remoteRef:
        key: ai-monitor-codex-auth
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
