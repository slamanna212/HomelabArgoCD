apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-usage-exporter
  namespace: ai-monitoring
  labels:
    app: ai-usage-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-usage-exporter
  template:
    metadata:
      labels:
        app: ai-usage-exporter
        component: metrics
    spec:
      initContainers:
        # CodexBar publishes no container image; fetch the static musl CLI
        # release and verify its checksum before use.
        - name: fetch-codexbar
          image: alpine:3.20
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              VERSION="v0.49.3"
              SHA256="869f4f9cce0ad9ef57fd04d01869665f186a43b2e1ecd1300151135ec79e68cd"
              TARBALL="CodexBarCLI-${VERSION}-linux-musl-x86_64.tar.gz"
              URL="https://github.com/steipete/CodexBar/releases/download/${VERSION}/${TARBALL}"
              wget -q -O /tmp/codexbar.tgz "${URL}"
              echo "${SHA256}  /tmp/codexbar.tgz" | sha256sum -c -
              mkdir -p /codexbar
              tar -xzf /tmp/codexbar.tgz -C /codexbar
              chmod +x /codexbar/codexbar /codexbar/CodexBarCLI
          volumeMounts:
            - name: codexbar-bin
              mountPath: /codexbar
      containers:
        - name: exporter
          image: python:3.12-alpine
          command: ["/bin/sh", "-ec"]
          args:
            - |
              pip install --quiet --no-cache-dir prometheus_client
              exec python /app/exporter.py
          env:
            - name: CODEXBAR_BIN
              value: /codexbar/codexbar
            - name: CODEXBAR_CONFIG
              value: /etc/codexbar/config.json
            - name: HOME
              value: /home/codexbar
            - name: REFRESH_INTERVAL
              value: "300"
          ports:
            - containerPort: 9100
              name: metrics
              protocol: TCP
          # Exporter serves /metrics from in-memory cache; a live codexbar
          # fetch can exceed probe timeouts, so probes hit /metrics only.
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: codexbar-bin
              mountPath: /codexbar
            - name: exporter-script
              mountPath: /app
            - name: codexbar-config
              mountPath: /etc/codexbar
            # OAuth credential files for Claude/Codex subscription usage.
            # Mounted read-only; the exporter's config.json is templated by
            # the ExternalSecret with the matching provider sources.
            - name: claude-credentials
              mountPath: /home/codexbar/.claude
            - name: codex-credentials
              mountPath: /home/codexbar/.codex
      volumes:
        - name: codexbar-bin
          emptyDir: {}
        - name: exporter-script
          configMap:
            name: ai-usage-exporter
        - name: codexbar-config
          secret:
            secretName: codexbar-config
            optional: false
        - name: claude-credentials
          secret:
            secretName: codexbar-credentials
            items:
              - key: claude-credentials
                path: .credentials.json
            optional: true
        - name: codex-credentials
          secret:
            secretName: codexbar-credentials
            items:
              - key: codex-auth
                path: auth.json
            optional: true
