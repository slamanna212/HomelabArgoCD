apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: blackbox-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blackbox-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blackbox-exporter
      annotations:
        # blackbox_exporter parses its config at start; it does NOT automatically
        # reload a projected ConfigMap change (verified 2026-09-14 against v0.28.0:
        # after atomically renaming a new config over the path, a newly added
        # module returned "Unknown module" while the old module kept working). It
        # does support reload on SIGHUP, but nothing in this Deployment sends one,
        # so a ConfigMap edit alone never takes effect. Bump this checksum whenever
        # blackbox-exporter-config changes to force a rollout.
        # sha256 of the content mounted at /config/blackbox.yml, i.e. the
        # blackbox.yml block scalar value (de-indented, trailing newline included)
        # — NOT the indented YAML source.
        configmap-checksum: "0377ebb655da642d5328b784ebeb93b8750241268a5a1444dc2876708278cc72"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: blackbox-exporter
          image: quay.io/prometheus/blackbox-exporter:v0.28.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/config/blackbox.yml
            - --web.listen-address=:9115
          ports:
            - name: http
              containerPort: 9115
              protocol: TCP
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_RAW
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: blackbox-exporter-config
