apiVersion: v1
kind: ConfigMap
metadata:
  name: todoist-mcp
  namespace: hermes
data:
  todoist_mcp.py: |
    #!/usr/bin/env python3
    """Todoist MCP server with read and task/project/comment management operations.

    The OAuth token is never embedded in this file.  The server reuses the existing
    Todoist OAuth token stored under the active Hermes home (or the legacy WebUI
    profile path when running inside the WebUI container).
    """
    from __future__ import annotations

    import fcntl
    import json
    import os
    import sys
    import tempfile
    import time
    import urllib.error
    import urllib.parse
    import urllib.request
    from pathlib import Path
    from typing import Any

    API = "https://api.todoist.com/api/v1"
    TOKEN_ENDPOINT = "https://todoist.com/oauth/access_token"


    def _token_candidates() -> list[Path]:
        explicit = os.environ.get("TODOIST_TOKEN_FILE")
        candidates: list[Path] = []
        if explicit:
            candidates.append(Path(explicit))
        hermes_home = os.environ.get("HERMES_HOME")
        if hermes_home:
            candidates.append(Path(hermes_home) / "mcp-tokens" / "todoist-direct.json")
        candidates.extend(
            [
                Path("/home/hermeswebui/.hermes/mcp-tokens/todoist-direct.json"),
                Path("/home/hermes/.hermes/mcp-tokens/todoist-direct.json"),
            ]
        )
        return list(dict.fromkeys(candidates))


    def _client_candidates(token_path: Path) -> list[Path]:
        explicit = os.environ.get("TODOIST_CLIENT_FILE")
        candidates = [Path(explicit)] if explicit else []
        candidates.extend(
            [
                token_path.with_name("todoist.client.json"),
                Path("/home/hermeswebui/.hermes/mcp-tokens/todoist.client.json"),
                Path("/home/hermes/.hermes/mcp-tokens/todoist.client.json"),
            ]
        )
        return list(dict.fromkeys(candidates))


    def _load_token() -> tuple[Path, dict[str, Any]]:
        for path in _token_candidates():
            try:
                data = json.loads(path.read_text())
                if isinstance(data, dict) and isinstance(data.get("access_token"), str):
                    return path, data
            except (OSError, KeyError, TypeError, ValueError):
                continue
        raise RuntimeError(
            "Todoist is not authorized. Existing OAuth token was not found in the Hermes profile."
        )


    def token() -> str:
        return _load_token()[1]["access_token"]


    def _client_id(token_path: Path) -> str:
        for path in _client_candidates(token_path):
            try:
                data = json.loads(path.read_text())
                value = data.get("client_id")
                if isinstance(value, str) and value:
                    return value
            except (OSError, AttributeError, TypeError, ValueError):
                continue
        raise RuntimeError("Todoist OAuth client registration is missing from the Hermes profile.")


    def _write_json_atomic(path: Path, data: dict[str, Any]) -> None:
        path.parent.mkdir(parents=True, exist_ok=True)
        fd, tmp_name = tempfile.mkstemp(prefix=f".{path.name}.", dir=path.parent)
        try:
            os.fchmod(fd, 0o600)
            with os.fdopen(fd, "w", encoding="utf-8") as handle:
                json.dump(data, handle, indent=2)
                handle.write("\n")
                handle.flush()
                os.fsync(handle.fileno())
            os.replace(tmp_name, path)
            os.chmod(path, 0o600)
        finally:
            try:
                os.unlink(tmp_name)
            except FileNotFoundError:
                pass


    def _refresh_access_token(path: Path, stale_access_token: str) -> dict[str, Any]:
        """Refresh once, serialize concurrent refreshes, and persist both tokens."""
        lock_path = path.with_name(f".{path.name}.lock")
        with lock_path.open("a+") as lock:
            fcntl.flock(lock.fileno(), fcntl.LOCK_EX)
            current = json.loads(path.read_text())
            # Another request may have refreshed while this request was waiting.
            if current.get("access_token") != stale_access_token:
                return current
            refresh_token = current.get("refresh_token")
            if not isinstance(refresh_token, str) or not refresh_token:
                raise RuntimeError("Todoist access token expired and no refresh token is available.")
            form = urllib.parse.urlencode(
                {
                    "grant_type": "refresh_token",
                    "refresh_token": refresh_token,
                    "client_id": _client_id(path),
                    "resource": "https://ai.todoist.net/mcp",
                }
            ).encode("utf-8")
            request = urllib.request.Request(
                TOKEN_ENDPOINT,
                data=form,
                headers={
                    "Content-Type": "application/x-www-form-urlencoded",
                    "Accept": "application/json",
                },
                method="POST",
            )
            try:
                with urllib.request.urlopen(request, timeout=30) as response:
                    refreshed = json.loads(response.read())
            except urllib.error.HTTPError as exc:
                detail = exc.read().decode("utf-8", "replace")[:500]
                raise RuntimeError(
                    f"Todoist OAuth refresh failed (HTTP {exc.code}). Re-authorize Todoist if needed: {detail}"
                ) from exc
            if not isinstance(refreshed, dict) or not refreshed.get("access_token"):
                raise RuntimeError("Todoist OAuth refresh returned no access token.")
            merged = dict(current)
            merged.update(refreshed)
            merged["obtained_at"] = int(time.time())
            _write_json_atomic(path, merged)
            return merged


    def _json_body(response: Any) -> Any:
        raw = response.read()
        if not raw:
            return None
        return json.loads(raw)


    def api_request(
        method: str,
        path: str,
        *,
        params: dict[str, object] | None = None,
        body: dict[str, object] | None = None,
    ) -> Any:
        url = API + path
        if params:
            clean = {k: str(v) for k, v in params.items() if v is not None}
            if clean:
                url += "?" + urllib.parse.urlencode(clean)
        data = None
        if body is not None:
            data = json.dumps(body).encode("utf-8")
        token_path, token_data = _load_token()
        access_token = token_data["access_token"]
        for attempt in range(2):
            headers = {
                "Authorization": "Bearer " + access_token,
                "Accept": "application/json",
            }
            if body is not None:
                headers["Content-Type"] = "application/json"
            request = urllib.request.Request(url, headers=headers, method=method, data=data)
            try:
                with urllib.request.urlopen(request, timeout=30) as response:
                    return _json_body(response)
            except urllib.error.HTTPError as exc:
                body_text = exc.read().decode("utf-8", "replace")[:2000]
                if exc.code == 401 and attempt == 0:
                    token_data = _refresh_access_token(token_path, access_token)
                    access_token = token_data["access_token"]
                    continue
                raise RuntimeError(f"Todoist API returned HTTP {exc.code}: {body_text}") from exc
            except urllib.error.URLError as exc:
                raise RuntimeError(f"Todoist API request failed: {exc.reason}") from exc
        raise RuntimeError("Todoist API request exhausted its refresh retry.")


    def api_get(path: str, params: dict[str, object] | None = None) -> Any:
        """Compatibility helper used by the migration scripts in /workspace."""
        return api_request("GET", path, params=params)


    def _id(kind: str, args: dict[str, Any]) -> str:
        value = args.get(f"{kind}_id")
        if value is None or not str(value).strip():
            raise ValueError(f"{kind}_id is required")
        return str(value)


    def _task_fields(args: dict[str, Any], *, create: bool) -> dict[str, Any]:
        allowed = (
            "content",
            "description",
            "project_id",
            "section_id",
            "parent_id",
            "order",
            "labels",
            "priority",
            "assignee_id",
            "due_string",
            "due_date",
            "due_datetime",
            "due_lang",
            "duration",
            "duration_unit",
            "deadline_date",
            "child_order",
            "day_order",
        )
        body = {key: args[key] for key in allowed if key in args and args[key] is not None}
        if create and not body.get("content"):
            raise ValueError("content is required")
        return body


    TOOLS = [
        {
            "name": "list_tasks",
            "description": "List active Todoist tasks. Supports filters such as 'today', 'overdue', or '#Project Name'.",
            "inputSchema": {
                "type": "object",
                "properties": {
                    "filter": {"type": "string"},
                    "limit": {"type": "integer", "minimum": 1, "maximum": 200},
                    "cursor": {"type": "string"},
                },
                "additionalProperties": False,
            },
        },
        {
            "name": "get_task",
            "description": "Get one active Todoist task by ID.",
            "inputSchema": {
                "type": "object",
                "properties": {"task_id": {"type": "string"}},
                "required": ["task_id"],
                "additionalProperties": False,
            },
        },
        {
            "name": "create_task",
            "description": "Create a Todoist task. Use project_id, due_string, priority, labels, or description when needed.",
            "inputSchema": {
                "type": "object",
                "properties": {
                    "content": {"type": "string"},
                    "description": {"type": "string"},
                    "project_id": {"type": "string"},
                    "section_id": {"type": "string"},
                    "parent_id": {"type": "string"},
                    "order": {"type": "integer"},
                    "labels": {"type": "array", "items": {"type": "string"}},
                    "priority": {"type": "integer", "minimum": 1, "maximum": 4},
                    "assignee_id": {"type": ["string", "integer"]},
                    "due_string": {"type": "string"},
                    "due_date": {"type": "string"},
                    "due_datetime": {"type": "string"},
                    "due_lang": {"type": "string"},
                    "duration": {"type": "integer", "minimum": 1},
                    "duration_unit": {"type": "string", "enum": ["minute", "day"]},
                    "deadline_date": {"type": "string"},
                },
                "required": ["content"],
                "additionalProperties": False,
            },
        },
        {
            "name": "update_task",
            "description": "Update editable fields on an existing Todoist task. Completing, reopening, and deleting use their dedicated tools.",
            "inputSchema": {
                "type": "object",
                "properties": {
                    "task_id": {"type": "string"},
                    "content": {"type": "string"},
                    "description": {"type": "string"},
                    "project_id": {"type": "string"},
                    "section_id": {"type": "string"},
                    "parent_id": {"type": "string"},
                    "order": {"type": "integer"},
                    "labels": {"type": "array", "items": {"type": "string"}},
                    "priority": {"type": "integer", "minimum": 1, "maximum": 4},
                    "assignee_id": {"type": ["string", "integer", "null"]},
                    "due_string": {"type": ["string", "null"]},
                    "due_date": {"type": ["string", "null"]},
                    "due_datetime": {"type": ["string", "null"]},
                    "due_lang": {"type": ["string", "null"]},
                    "duration": {"type": ["integer", "null"], "minimum": 1},
                    "duration_unit": {"type": ["string", "null"], "enum": ["minute", "day", None]},
                    "deadline_date": {"type": ["string", "null"]},
                    "child_order": {"type": "integer"},
                    "day_order": {"type": "integer"},
                },
                "required": ["task_id"],
                "additionalProperties": False,
            },
        },
        {
            "name": "complete_task",
            "description": "Complete a Todoist task and move it to completed history.",
            "inputSchema": {
                "type": "object",
                "properties": {"task_id": {"type": "string"}},
                "required": ["task_id"],
                "additionalProperties": False,
            },
        },
        {
            "name": "reopen_task",
            "description": "Reopen a completed Todoist task by ID.",
            "inputSchema": {
                "type": "object",
                "properties": {"task_id": {"type": "string"}},
                "required": ["task_id"],
                "additionalProperties": False,
            },
        },
        {
            "name": "delete_task",
            "description": "Permanently delete a Todoist task and its subtasks.",
            "inputSchema": {
                "type": "object",
                "properties": {"task_id": {"type": "string"}},
                "required": ["task_id"],
                "additionalProperties": False,
            },
        },
        {
            "name": "list_projects",
            "description": "List active Todoist projects.",
            "inputSchema": {"type": "object", "properties": {}, "additionalProperties": False},
        },
        {
            "name": "get_project",
            "description": "Get one Todoist project by ID.",
            "inputSchema": {
                "type": "object",
                "properties": {"project_id": {"type": "string"}},
                "required": ["project_id"],
                "additionalProperties": False,
            },
        },
        {
            "name": "create_project",
            "description": "Create a Todoist project.",
            "inputSchema": {
                "type": "object",
                "properties": {
                    "name": {"type": "string"},
                    "description": {"type": "string"},
                    "parent_id": {"type": "string"},
                    "color": {"type": "string"},
                    "is_favorite": {"type": "boolean"},
                    "view_style": {"type": "string", "enum": ["list", "board"]},
                    "workspace_id": {"type": ["string", "integer"]},
                },
                "required": ["name"],
                "additionalProperties": False,
            },
        },
        {
            "name": "update_project",
            "description": "Update an existing Todoist project.",
            "inputSchema": {
                "type": "object",
                "properties": {
                    "project_id": {"type": "string"},
                    "name": {"type": "string"},
                    "description": {"type": "string"},
                    "color": {"type": "string"},
                    "is_favorite": {"type": "boolean"},
                    "view_style": {"type": "string", "enum": ["list", "board"]},
                    "is_collapsed": {"type": "boolean"},
                    "folder_id": {"type": ["string", "integer", "null"]},
                },
                "required": ["project_id"],
                "additionalProperties": False,
            },
        },
        {
            "name": "delete_project",
            "description": "Permanently delete a Todoist project, including its sections and tasks.",
            "inputSchema": {
                "type": "object",
                "properties": {"project_id": {"type": "string"}},
                "required": ["project_id"],
                "additionalProperties": False,
            },
        },
        {
            "name": "list_comments",
            "description": "List comments for exactly one Todoist task or project.",
            "inputSchema": {
                "type": "object",
