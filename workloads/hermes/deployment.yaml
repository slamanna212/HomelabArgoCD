apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
spec:
  replicas: 1
  # Hermes keeps mutable state (sessions DB, skills, memory, config) under
  # HERMES_HOME on a ReadWriteOnce PVC and is a strict single-writer. Two pods
  # against the same home corrupt lock files and gateway_state.json, so never
  # scale this past 1 and never let a rolling update run two pods at once.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      annotations:
        hermes.nousresearch.com/restart-at: "2026-08-14T23:53:32Z"
      labels:
        app: hermes
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Both upstream images start their entrypoint as root to align UID/GID and
        # prepare mounts, then drop to an unprivileged user (1000). We pre-create and
        # chown the PVC subdirectories here so that drop actually lands on writable
        # dirs — fsGroup alone leaves root-created dirs at mode 755, which is r-x for
        # the group and leaves the agent unable to write its own home.
        - name: prepare
          # Upstream main after the 2026-08 security pass: aiohttp 3.14.3,
          # cryptography 50.0.0, and SQLite 3.53.4. Pin the immutable
          # multi-architecture digest rather than the moving `main` tag.
          image: nousresearch/hermes-agent@sha256:ccc46f54e3a0938ec955df36c40db0e3a01ce5bc3a8639376a840016175654d3
          command: ["/bin/sh", "-ec"]
          args:
            - |
              # The WebUI installs the agent's Python deps from a copy of the agent
              # source at startup. Upstream's compose shares /opt/hermes as a named
              # Docker volume, which famously goes stale after an agent image bump
              # (the volume is only initialised on first `up`). Copying into an
              # emptyDir instead means it is repopulated from the image on every pod
              # start, so that whole class of upgrade bug does not exist here.
              cp -a /opt/hermes/. /agent-src/
              # cp -a preserves ownership and modes, and this runs as root. The agent
              # image ships owner-only-readable files under .playwright/, so the copy
              # came out unreadable to the WebUI, which runs as uid 1000 and rsyncs
              # this whole tree into a writable build dir before installing its deps.
              # That rsync died on "Permission denied" and took the container with it.
              # Hand the copy to 1000 and guarantee it can traverse and read it.
              chown -R 1000:1000 /agent-src
              chmod -R u+rX /agent-src

              mkdir -p /data/home /data/workspace /data/ai-usage
              chown 1000:1000 /data/home /data/workspace /data/ai-usage

              # Seed config.yaml exactly once. Hermes rewrites this file at runtime
              # (model switching from the WebUI, onboarding), so re-copying it on
              # every restart would silently revert those changes.
              if [ ! -f /data/home/config.yaml ]; then
                cp /bootstrap/config.yaml /data/home/config.yaml
                chown 1000:1000 /data/home/config.yaml
                echo "seeded config.yaml from ConfigMap"
              elif ! grep -q '^_config_version:' /data/home/config.yaml; then
                # A config with no _config_version is one Hermes refuses to migrate
                # and ignores entirely, so it is not a config worth preserving —
                # but back it up rather than delete, in case it holds edits.
                cp /data/home/config.yaml /data/home/config.yaml.unversioned.bak
                cp /bootstrap/config.yaml /data/home/config.yaml
                chown 1000:1000 /data/home/config.yaml /data/home/config.yaml.unversioned.bak
                echo "replaced unversioned config.yaml (backup: config.yaml.unversioned.bak)"
              else
                echo "config.yaml already exists on the PVC; leaving it untouched"
              fi

              # Apply the cron post-script completion hook to the shared agent
              # source copy (see hermes-cron-post-script-configmap.yaml).
              # Patching agent-src here means the WebUI installs the patched
              # agent at its next boot. Never fatal: a patch mismatch must not
              # block pod startup.
              python3 /patches/apply_patch.py /agent-src || echo "[init] WARNING: agent source patch failed (non-fatal)"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: agent-src
              mountPath: /agent-src
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: patches
              mountPath: /patches
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
        # Install the only Python dependency into an emptyDir so the long-running
        # collector can run unprivileged and restarts do not download packages.
        - name: install-ai-collector-deps
          image: python:3.12-alpine
          command: ["/bin/sh", "-ec"]
          args:
            - |
              pip install --no-cache-dir --target /python-packages prometheus-client==0.22.1
              chown -R 1000:1000 /python-packages
          volumeMounts:
            - name: ai-collector-deps
              mountPath: /python-packages
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      containers:
        # The gateway process: Discord, cron/scheduled jobs, and the agent API on
        # 8642. This is what keeps working while you are away — the WebUI alone
        # cannot tick scheduled jobs.
        - name: hermes-agent
          image: nousresearch/hermes-agent@sha256:ccc46f54e3a0938ec955df36c40db0e3a01ce5bc3a8639376a840016175654d3
          # The upstream image does not include the cron post_script
          # completion hook (implemented locally 2026-08-13). Wrap the stock
          # entrypoint: apply the patch to the live /opt/hermes source first,
          # then exec /init with the original arguments so s6-overlay remains
          # PID 1 exactly as in the image default (see the Dockerfile's
          # entrypoint-dispatch.sh). The patch step is never fatal.
          command: ["/bin/sh", "-ec"]
          args:
            - |
              python3 /patches/apply_patch.py /opt/hermes || echo "[gateway] WARNING: agent source patch failed (non-fatal)"
              exec /init /opt/hermes/docker/main-wrapper.sh gateway run
          env:
            - name: HERMES_HOME
              value: /home/hermes/.hermes
            - name: HERMES_UID
              value: "1000"
            - name: HERMES_GID
              value: "1000"
            # Without an explicit allowlist any Discord user who can see the bot
            # could drive an agent that has a shell in your cluster. Keep this false.
            - name: GATEWAY_ALLOW_ALL_USERS
              value: "false"
            # Numeric Discord user IDs allowed to drive the agent, comma-separated.
            # Never leave this empty: an empty allowlist reads like a working config
            # while silently letting nobody in.
            - name: DISCORD_ALLOWED_USERS
              value: "123546381628604420"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: openrouter-api-key
            # Talks to api.deepseek.com directly, bypassing OpenRouter. Both containers
            # get it: the gateway uses it for Discord and cron, and the WebUI needs it
            # too because it runs the agent in-process for chat.
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: deepseek-api-key
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: discord-bot-token
            # Starts the gateway's HTTP API on 127.0.0.1:8642 (its defaults), which is
            # what the WebUI's Tasks/cron health probe checks. Counter-intuitively there
            # is no API_SERVER_ENABLED to set: gateway/config.py enrolls the platform
            # only when API_SERVER_KEY is present and at least 16 characters, because
            # "API_SERVER_ENABLED alone would load an unauthenticated platform whose
            # adapter refuses to start at connect()". Without this nothing binds 8642 and
            # the WebUI shows "Hermes agent is not responding" / "gateway endpoint not
            # reachable" while chat still works, since chat runs the agent in-process.
            # 127.0.0.1 keeps it inside the pod's network namespace — the WebUI reaches
            # it over loopback, nothing outside the pod can.
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: api-server-key
            # Hermes Mobile Companion / Conduit talk to the official dashboard on
            # 9119 - same MetalLB IP as the WebUI, one port over. The official image
            # ships an s6 dashboard slot that activates on HERMES_DASHBOARD and fails
            # closed without an auth provider (--insecure is a no-op since the June
            # 2026 hardening).
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: dashboard-auth-username
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: dashboard-auth-password
            - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: dashboard-auth-secret
          ports:
            - name: dashboard
              containerPort: 9119
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /home/hermes/.hermes
              subPath: home
            - name: data
              mountPath: /workspace
              subPath: workspace
            - name: todoist-mcp
              mountPath: /opt/hermes-todoist
              readOnly: true
            # Chromium for the agent's browser tools needs more than the default 64Mi.
            - name: dshm
              mountPath: /dev/shm
            - name: patches
              mountPath: /patches
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
        # The web UI that the Hermex iPhone app talks to. Shares HERMES_HOME with the
        # gateway above, which is how the two see the same sessions and memory.
        - name: hermes-webui
          # DELIBERATELY on the experimental channel. Do not "fix" this back to a
          # stable tag — every stable release, including the newest (v0.52.106),
          # installs the agent with `uv pip install "$_stage_src[all]"`, i.e. NOT
          # editable. That drives PEP 517 build_wheel -> bdist_wheel, and the agent's
          # setup.py raises on purpose:
          #   RuntimeError: Building wheels or sdists for hermes-agent is not supported
          # (the wheel would ship without its bundled locales/skills/web_dist assets).
          # The container then exits 1 in a crash loop. `uv pip install -e` first
          # appears in exp-v0.52.159, so no stable release currently works in a
          # two-container setup. Revisit once a stable release carries the fix.
          image: ghcr.io/nesquena/hermes-webui:0.52.264
          env:
            - name: HERMES_WEBUI_HOST
              value: "0.0.0.0"
            - name: HERMES_WEBUI_PORT
              value: "8787"
            - name: HERMES_WEBUI_STATE_DIR
              value: /home/hermeswebui/.hermes/webui
            # Same pod, so the gateway is on loopback rather than a service name.
            # Drives the Tasks/System "gateway" status and scheduled-job ticking.
            - name: HERMES_API_URL
              value: http://127.0.0.1:8642
            # api/agent_health.py honours HERMES_API_URL, but api/updates.py (agent
            # version display) reads only these two and otherwise defaults to
            # http://hermes-agent:8642 — a compose service name that does not resolve
            # in a single pod. Set them so every gateway probe points at loopback.
            - name: GATEWAY_HEALTH_URL
              value: http://127.0.0.1:8642
            - name: HERMES_GATEWAY_HEALTH_URL
              value: http://127.0.0.1:8642
            - name: WANTED_UID
              value: "1000"
            - name: WANTED_GID
              value: "1000"
            # Everything on the LAN can reach this service's IP directly, so this
            # password is the only thing in front of the agent. It is also the
            # password Hermex asks for.
            - name: HERMES_WEBUI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: webui-password
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: openrouter-api-key
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: deepseek-api-key
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /home/hermeswebui/.hermes
              subPath: home
            # Read-only on purpose: the WebUI only reads this to `uv pip install` the
            # agent's dependencies, so a compromised WebUI cannot rewrite agent code.
            - name: agent-src
              mountPath: /home/hermeswebui/.hermes/hermes-agent
              readOnly: true
            - name: data
              mountPath: /workspace
              subPath: workspace
            - name: todoist-mcp
              mountPath: /opt/hermes-todoist
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            # Generous: first boot installs the agent's Python deps from the shared
            # source copy before /health answers.
            initialDelaySeconds: 300
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              # Headroom for the dependency install at boot, which resolves and builds
              # the agent's full tree. Upstream's compose sets no memory limit at all.
              memory: 4Gi
        # Native AI allowance collector. Claude uses its own persisted OAuth
        # refresh-token lifecycle; Codex is read-only against the gateway auth store.
        - name: ai-usage-collector
          image: python:3.12-alpine
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          command: ["/bin/sh", "-ec"]
          args:
            - exec /app/startup.sh
          env:
            - name: HOME
              value: /data
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONPATH
              value: /python-packages
            - name: CLAUDE_STATE
              value: /data/claude/oauth.json
            - name: CLAUDE_PENDING_STATE
              value: /data/claude/oauth-pending.json
            - name: GATEWAY_AUTH
              value: /creds/home/auth.json
            - name: REFRESH_INTERVAL
              value: "300"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: openrouter-api-key
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: deepseek-api-key
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            # Gateway's live auth store — read-only; the gateway owns refresh rotation.
            - name: data
              mountPath: /creds/home
              subPath: home
              readOnly: true
            # Claude OAuth state and collector-local runtime state.
            - name: data
              mountPath: /data
              subPath: ai-usage
            - name: ai-collector-deps
              mountPath: /python-packages
              readOnly: true
            - name: collector-scripts
              mountPath: /app
              readOnly: true
      terminationGracePeriodSeconds: 120
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: agent-src
          emptyDir: {}
        - name: bootstrap
          configMap:
            name: hermes-config
        - name: todoist-mcp
          configMap:
            name: todoist-mcp
            defaultMode: 0555
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: patches
          configMap:
            name: hermes-cron-post-script
        - name: ai-collector-deps
          emptyDir: {}
        - name: collector-scripts
          configMap:
            name: ai-usage-collector
            defaultMode: 0555
