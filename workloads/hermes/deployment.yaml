apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
spec:
  replicas: 1
  # Hermes keeps mutable state (sessions DB, skills, memory, config) under
  # HERMES_HOME on a ReadWriteOnce PVC and is a strict single-writer. Two pods
  # against the same home corrupt lock files and gateway_state.json, so never
  # scale this past 1 and never let a rolling update run two pods at once.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      annotations:
        hermes.nousresearch.com/restart-at: "2026-09-15T02:28:57Z"
      labels:
        app: hermes
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Both upstream images start their entrypoint as root to align UID/GID and
        # prepare mounts, then drop to an unprivileged user (1000). We pre-create and
        # chown the PVC subdirectories here so that drop actually lands on writable
        # dirs — fsGroup alone leaves root-created dirs at mode 755, which is r-x for
        # the group and leaves the agent unable to write its own home.
        - name: prepare
          # Pinned to versioned release tag v2026.8.31 + its multi-arch digest
          # (sha256:64923faeae26..., Docker Hub, pushed 2026-08-31). Refit date:
          # 2026-09-02, replacing the 2026-08-13 `main` digest pin (PR #86).
          # Digest-only refs are invisible to Renovate's regex manager; the
          # tag@digest form keeps this content-addressed across nodes and tag
          # re-pushes while renovate.json still tracks tag+digest updates.
          image: nousresearch/hermes-agent:v2026.8.31@sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524
          command: ["/bin/sh", "-ec"]
          args:
            - |
              # The WebUI installs the agent's Python deps from a copy of the agent
              # source at startup. Upstream's compose shares /opt/hermes as a named
              # Docker volume, which famously goes stale after an agent image bump
              # (the volume is only initialised on first `up`). Copying into an
              # emptyDir instead means it is repopulated from the image on every pod
              # start, so that whole class of upgrade bug does not exist here.
              cp -a /opt/hermes/. /agent-src/
              # cp -a preserves ownership and modes, and this runs as root. The agent
              # image ships owner-only-readable files under .playwright/, so the copy
              # came out unreadable to the WebUI, which runs as uid 1000 and rsyncs
              # this whole tree into a writable build dir before installing its deps.
              # That rsync died on "Permission denied" and took the container with it.
              # Hand the copy to 1000 and guarantee it can traverse and read it.
              chown -R 1000:1000 /agent-src
              chmod -R u+rX /agent-src

              mkdir -p /data/home /data/workspace /data/ai-usage
              chown 1000:1000 /data/home /data/workspace /data/ai-usage

              # Seed config.yaml exactly once. Hermes rewrites this file at runtime
              # (model switching from the WebUI, onboarding), so re-copying it on
              # every restart would silently revert those changes.
              if [ ! -f /data/home/config.yaml ]; then
                cp /bootstrap/config.yaml /data/home/config.yaml
                chown 1000:1000 /data/home/config.yaml
                echo "seeded config.yaml from ConfigMap"
              elif ! grep -q '^_config_version:' /data/home/config.yaml; then
                # A config with no _config_version is one Hermes refuses to migrate
                # and ignores entirely, so it is not a config worth preserving —
                # but back it up rather than delete, in case it holds edits.
                cp /data/home/config.yaml /data/home/config.yaml.unversioned.bak
                cp /bootstrap/config.yaml /data/home/config.yaml
                chown 1000:1000 /data/home/config.yaml /data/home/config.yaml.unversioned.bak
                echo "replaced unversioned config.yaml (backup: config.yaml.unversioned.bak)"
              else
                echo "config.yaml already exists on the PVC; leaving it untouched"
              fi

              # Enforce bounded OpenViking recall on both fresh and existing PVCs.
              # The migrator backs up the pre-change config once and preserves all
              # unrelated user settings.
              /opt/hermes/.venv/bin/python /memory-patches/apply_memory_config.py /data/home/config.yaml || exit 1

              # The memory sidecar fix is fail-closed: serving the old writer is
              # worse than refusing startup when the pinned source drifts.
              python3 /memory-patches/apply_patch.py /agent-src /memory-patches/agent-spec.json || exit 1
          volumeMounts:
            - name: data
              mountPath: /data
            - name: agent-src
              mountPath: /agent-src
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: memory-patches
              mountPath: /memory-patches
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
        # Install the only Python dependency into an emptyDir so the long-running
        # collector can run unprivileged and restarts do not download packages.
        - name: install-ai-collector-deps
          image: python:3.12-alpine
          command: ["/bin/sh", "-ec"]
          args:
            - |
              pip install --no-cache-dir --target /python-packages prometheus-client==0.22.1
              chown -R 1000:1000 /python-packages
          volumeMounts:
            - name: ai-collector-deps
              mountPath: /python-packages
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      containers:
        # The gateway process: Discord, cron/scheduled jobs, and the agent API on
        # 8642. This is what keeps working while you are away — the WebUI alone
        # cannot tick scheduled jobs.
        - name: hermes-agent
          image: nousresearch/hermes-agent:v2026.8.31@sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524
          # Wrap the stock entrypoint: apply the memory patch to the live
          # /opt/hermes source first, then exec /init with the original arguments
          # so s6-overlay remains PID 1 exactly as in the image default (see the
          # Dockerfile's entrypoint-dispatch.sh). This patch is FAIL-CLOSED: a
          # mismatch against the pinned source refuses startup rather than serving
          # the unfixed writer. The local cron post_script patch was removed
          # 2026-09-24 — its only consumer was a retired no-op, and it was the
          # file that drifted on the last image bump.
          command: ["/bin/sh", "-ec"]
          args:
            - |
              python3 /memory-patches/apply_patch.py /opt/hermes /memory-patches/agent-spec.json || exit 1
              exec /init /opt/hermes/docker/main-wrapper.sh gateway run
          env:
            - name: HERMES_HOME
              value: /home/hermes/.hermes
            - name: HERMES_UID
              value: "1000"
            - name: HERMES_GID
              value: "1000"
            # Without an explicit allowlist any Discord user who can see the bot
            # could drive an agent that has a shell in your cluster. Keep this false.
            - name: GATEWAY_ALLOW_ALL_USERS
              value: "false"
            # Numeric Discord user IDs allowed to drive the agent, comma-separated.
            # Never leave this empty: an empty allowlist reads like a working config
            # while silently letting nobody in.
            - name: DISCORD_ALLOWED_USERS
              value: "123546381628604420"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: openrouter-api-key
            # Talks to api.deepseek.com directly, bypassing OpenRouter. Both containers
            # get it: the gateway uses it for Discord and cron, and the WebUI needs it
            # too because it runs the agent in-process for chat.
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: deepseek-api-key
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: discord-bot-token
            # Starts the gateway's HTTP API on 127.0.0.1:8642 (its defaults), which is
            # what the WebUI's Tasks/cron health probe checks. Counter-intuitively there
            # is no API_SERVER_ENABLED to set: gateway/config.py enrolls the platform
            # only when API_SERVER_KEY is present and at least 16 characters, because
            # "API_SERVER_ENABLED alone would load an unauthenticated platform whose
            # adapter refuses to start at connect()". Without this nothing binds 8642 and
            # the WebUI shows "Hermes agent is not responding" / "gateway endpoint not
            # reachable" while chat still works, since chat runs the agent in-process.
            # 127.0.0.1 keeps it inside the pod's network namespace — the WebUI reaches
            # it over loopback. API_SERVER_HOST widens that bind to the pod
            # interface so LAN clients (Continue, Open WebUI) can reach it —
            # API_SERVER_KEY is then the only thing in front of an agent with
            # a shell in this cluster.
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: api-server-key
            # Hermes Mobile Companion / Conduit talk to the official dashboard on
            # 9119 - same MetalLB IP as the WebUI, one port over. The official image
            # ships an s6 dashboard slot that activates on HERMES_DASHBOARD and fails
            # closed without an auth provider (--insecure is a no-op since the June
            # 2026 hardening).
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: dashboard-auth-username
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: dashboard-auth-password
            - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: dashboard-auth-secret
            # Point the browser-harness daemon at the chromium sidecar in this
            # pod (see container "chromium" below) instead of hunting for a
            # desktop Chrome that does not exist on this host.
            - name: BU_CDP_URL
              value: http://127.0.0.1:9222
            # The image default is a single path (/opt/data), which made cron's
            # write_file refuse every legitimate project-context write. That refusal
            # is why the job carried a base64-through-terminal recipe — the pattern
            # that reached Sam as an opaque approval prompt (2026-09-24 audit).
            # Widen it to the paths this pod actually writes.
            - name: HERMES_WRITE_SAFE_ROOT
              value: /workspace:/tmp
          ports:
            - name: dashboard
              containerPort: 9119
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /home/hermes/.hermes
              subPath: home
            - name: data
              mountPath: /workspace
              subPath: workspace
            - name: todoist-mcp
              mountPath: /opt/hermes-todoist
              readOnly: true
            # Chromium for the agent's browser tools needs more than the default 64Mi.
            - name: dshm
              mountPath: /dev/shm
            - name: memory-patches
              mountPath: /memory-patches
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
        # The web UI that the Hermex iPhone app talks to. Shares HERMES_HOME with the
        # gateway above, which is how the two see the same sessions and memory.
        - name: hermes-webui
          # DELIBERATELY on the experimental channel. Do not "fix" this back to a
          # stable tag — every stable release, including the newest (v0.52.106),
          # installs the agent with `uv pip install "$_stage_src[all]"`, i.e. NOT
          # editable. That drives PEP 517 build_wheel -> bdist_wheel, and the agent's
          # setup.py raises on purpose:
          #   RuntimeError: Building wheels or sdists for hermes-agent is not supported
          # (the wheel would ship without its bundled locales/skills/web_dist assets).
          # The container then exits 1 in a crash loop. `uv pip install -e` first
          # appears in exp-v0.52.159, so no stable release currently works in a
          # two-container setup. Revisit once a stable release carries the fix.
          image: ghcr.io/nesquena/hermes-webui:0.52.264
          # Run the upstream UID/setup sequence through a Git-managed wrapper.
          # The wrapper inserts the WebUI source patch after /apptoo is copied
          # into /app and before server.py starts.
          command: ["/bin/bash", "-ec"]
          args:
            - exec /memory-patches/webui-entrypoint.sh
          env:
            - name: HERMES_WEBUI_HOST
              value: "0.0.0.0"
            - name: HERMES_WEBUI_PORT
              value: "8787"
            - name: HERMES_WEBUI_STATE_DIR
              value: /home/hermeswebui/.hermes/webui
            # api/config.py honors this explicit source selection. It points at
            # the writable staged copy created by hermeswebui_init.bash.
            - name: HERMES_WEBUI_AGENT_DIR
              value: /app/hermes-agent-src
            # Same pod, so the gateway is on loopback rather than a service name.
            # Drives the Tasks/System "gateway" status and scheduled-job ticking.
            - name: HERMES_API_URL
              value: http://127.0.0.1:8642
            # api/agent_health.py honours HERMES_API_URL, but api/updates.py (agent
            # version display) reads only these two and otherwise defaults to
            # http://hermes-agent:8642 — a compose service name that does not resolve
            # in a single pod. Set them so every gateway probe points at loopback.
            - name: GATEWAY_HEALTH_URL
              value: http://127.0.0.1:8642
            - name: HERMES_GATEWAY_HEALTH_URL
              value: http://127.0.0.1:8642
            - name: WANTED_UID
              value: "1000"
            - name: WANTED_GID
              value: "1000"
            # Everything on the LAN can reach this service's IP directly, so this
            # password is the only thing in front of the agent. It is also the
            # password Hermex asks for.
            - name: HERMES_WEBUI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: webui-password
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: openrouter-api-key
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: deepseek-api-key
            # The WebUI runs the agent in-process, so its browser tools need the
            # same CDP endpoint as the gateway container.
            - name: BU_CDP_URL
              value: http://127.0.0.1:9222
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /home/hermeswebui/.hermes
              subPath: home
            # Read-only on purpose: the WebUI only reads this to `uv pip install` the
            # agent's dependencies, so a compromised WebUI cannot rewrite agent code.
            - name: agent-src
              mountPath: /home/hermeswebui/.hermes/hermes-agent
              readOnly: true
            - name: data
              mountPath: /workspace
              subPath: workspace
            - name: todoist-mcp
              mountPath: /opt/hermes-todoist
              readOnly: true
            - name: memory-patches
              mountPath: /memory-patches
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            # Generous: first boot installs the agent's Python deps from the shared
            # source copy before /health answers.
            initialDelaySeconds: 300
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              # Headroom for the dependency install at boot, which resolves and builds
              # the agent's full tree. Upstream's compose sets no memory limit at all.
              memory: 4Gi
        # Astra — Sam's own Hermes web UI (github.com/slamanna212/Astra), running as a
        # SECOND UI option alongside nesquena's hermes-webui above, not a replacement.
        # Same PVC and same loopback path to the gateway as the container above, so
        # both UIs see the same sessions, memory and skills.
        - name: astra
          # Immutable per-commit tag: Astra's Container workflow publishes only
          # `latest` + `sha-<full sha>`, so this is the reproducible pin. Do NOT move
          # it to `latest` — Astra is under active development and a floating tag
          # would silently change the running UI on any pod restart or node reboot,
          # the same trap as gluetun's `:latest` in CLAUDE.md. To bump, replace the
          # sha with the new commit's sha once its "Container" run has pushed it.
          image: ghcr.io/slamanna212/astra:sha-d1ecf824d06b1ca2c079973a636494c770f9b180
          imagePullPolicy: IfNotPresent
          # The image already runs as uid 1000 and never needs root (unlike the two
          # upstream images, which do UID alignment then drop), so it can be locked
          # down properly.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          env:
            # Astra derives every path from HERMES_HOME and refuses to start without
            # it — deliberately empty in the image so no deployment inherits the
            # base image's default.
            - name: HERMES_HOME
              value: /home/astra/.hermes
            # Files/Logs browse only this root, never HERMES_HOME.
            - name: ASTRA_WORKSPACE_DIR
              value: /workspace
            # Astra fails closed at startup without a password hash and a >=32-char
            # session secret (astra/config.py). Both are Key Vault keys, and the
            # deployment must NOT be merged before they exist: a container that
            # cannot start never becomes Ready, which drops this whole pod out of
            # the hermes Service — taking 8787/9119/8642 down with it.
            # Note it is the scrypt HASH here, never the password: Astra's own
            # design keeps the plaintext out of the container entirely.
            - name: ASTRA_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: astra-password-hash
            - name: ASTRA_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: astra-session-secret
            # This Service is a plain HTTP LoadBalancer on the LAN — nothing in front
            # of 10.1.20.205 terminates TLS. Astra defaults this to true, and a
            # Secure cookie is never sent back over http://, so login would appear to
            # succeed and then silently not persist. Flip it to true only if this
            # port ever gets TLS.
            - name: ASTRA_COOKIE_SECURE
              value: "false"
            # Chat runs the agent in-process here, so this container needs the same
            # model credentials the hermes-webui container gets.
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: openrouter-api-key
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: deepseek-api-key
            # Parity with the gateway and the legacy WebUI (2026-09-24). Astra runs
            # the agent IN-PROCESS, so without the patched source it reads the same
            # config with different code: the memory-sidecar fix and the cron hook
            # are applied to /agent-src by the prepare init container and are absent
            # from the image's own /opt/hermes. Astra prepends this to sys.path at
            # startup (astra/config.py::apply_hermes_src) and fails closed when the
            # directory is missing, so a bad mount is a loud startup error.
            - name: ASTRA_HERMES_SRC
              value: /home/astra/hermes-agent
            # Same browser contract as the other agent-running containers. All
            # containers share the pod network namespace, so the chromium sidecar is
            # reachable on loopback. Astra shipped without this and its sessions
            # reported "chrome-not-running" while the sidecar was healthy.
            - name: BU_CDP_URL
              value: http://127.0.0.1:9222
          ports:
            - name: astra
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /home/astra/.hermes
              subPath: home
            - name: data
              mountPath: /workspace
              subPath: workspace
            # Read-only patched agent source (the prepare init container copies the
            # pinned image into this emptyDir and chowns it to 1000). Astra runs as
            # uid 1000 and needs read + traverse only.
            - name: agent-src
              mountPath: /home/astra/hermes-agent
              readOnly: true
          # /api/health is Astra's unauthenticated liveness; it pings state.db.
          # Deliberately no long initial delay: unlike the WebUI there is no
          # dependency install at boot, so the process is serving in seconds.
          readinessProbe:
            httpGet:
              path: /api/health
              port: astra
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: astra
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              # Headroom for the in-process agent runtime (chat), not a dep install.
              memory: 2Gi
        # Native AI allowance collector. Claude uses its own persisted OAuth
        # refresh-token lifecycle; Codex is read-only against the gateway auth store.
        - name: ai-usage-collector
          image: python:3.12-alpine
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          command: ["/bin/sh", "-ec"]
          args:
            - exec /app/startup.sh
          env:
            - name: HOME
              value: /data
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONPATH
              value: /python-packages
            - name: CLAUDE_STATE
              value: /data/claude/oauth.json
            - name: CLAUDE_PENDING_STATE
              value: /data/claude/oauth-pending.json
            - name: GATEWAY_AUTH
              value: /creds/home/auth.json
            - name: REFRESH_INTERVAL
              value: "300"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: openrouter-api-key
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: deepseek-api-key
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            # Gateway's live auth store — read-only; the gateway owns refresh rotation.
            - name: data
              mountPath: /creds/home
              subPath: home
              readOnly: true
            # Claude OAuth state and collector-local runtime state.
            - name: data
              mountPath: /data
              subPath: ai-usage
            - name: ai-collector-deps
              mountPath: /python-packages
              readOnly: true
            - name: collector-scripts
              mountPath: /app
              readOnly: true
        # Headless Chromium for the agent's browser tools (browser_exec /
        # browser-harness). The harness only drives an already-running Chromium
        # over CDP — it cannot launch one itself on a headless host (no DISPLAY,
        # and its local launcher expects an interactive desktop Chrome). So run
        # the Chrome headless shell the agent image already ships (Playwright's
        # chromium_headless_shell, revision 1234 under /opt/hermes/.playwright)
        # as a sidecar. Same pod = same network namespace, so both agent
        # containers reach it on loopback via BU_CDP_URL.
        # The revision dir tracks the pinned agent image digest above — bump
        # them together.
        - name: chromium
          image: nousresearch/hermes-agent@sha256:ccc46f54e3a0938ec955df36c40db0e3a01ce5bc3a8639376a840016175654d3
          command: ["/bin/sh", "-ec"]
          args:
            - |
              exec /opt/hermes/.playwright/chromium_headless_shell-1234/chrome-headless-shell-linux64/chrome-headless-shell \
                --remote-debugging-address=127.0.0.1 \
                --remote-debugging-port=9222 \
                --no-sandbox \
                --disable-gpu \
                --no-first-run \
                --no-default-browser-check \
                --user-data-dir=/tmp/chromium-profile
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          env:
            - name: HOME
              value: /tmp
          ports:
            - name: cdp
              containerPort: 9222
              protocol: TCP
          # CDP is bound to loopback on purpose (nothing outside the pod can
          # drive the browser), so kubelet's httpGet against the pod IP can't
          # probe it — use an exec probe that runs inside the container.
          # Restarts a wedged browser without touching the rest of the pod.
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9222/json/version',timeout=3)"
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
