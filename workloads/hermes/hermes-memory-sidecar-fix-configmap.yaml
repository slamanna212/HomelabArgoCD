        },
        {
          "path": "agent/memory_manager.py",
          "old": "def sanitize_context(text: str) -> str:\n    \"\"\"Strip fence tags, injected context blocks, and system notes from provider output.\"\"\"\n    text = _INTERNAL_CONTEXT_RE.sub('', text)\n    text = _INTERNAL_NOTE_RE.sub('', text)\n    text = _FENCE_TAG_RE.sub('', text)\n    return text\n\n\n",
          "new": "def sanitize_context(text: str) -> str:\n    \"\"\"Strip fence tags, injected context blocks, and system notes from provider output.\"\"\"\n    text = _INTERNAL_CONTEXT_RE.sub('', text)\n    text = _INTERNAL_NOTE_RE.sub('', text)\n    text = _FENCE_TAG_RE.sub('', text)\n    return text\n\n\ndef strip_memory_context_for_replay(text: Any) -> str:\n    \"\"\"Return text safe to persist and replay without recalled memory context.\"\"\"\n    if not isinstance(text, str):\n        return ''\n    clean = _INTERNAL_CONTEXT_RE.sub('', text)\n    clean = _UNTERMINATED_CONTEXT_RE.sub('', clean)\n    clean = _INTERNAL_NOTE_RE.sub('', clean)\n    clean = _FENCE_TAG_RE.sub('', clean)\n    clean = _REPLAY_BLANK_LINES_RE.sub('\\n\\n', clean)\n    return clean.strip()\n\n\ndef persistable_api_content(api_content: Any, clean_content: Any) -> Optional[str]:\n    \"\"\"Return a replay-safe sidecar, omitting recall-only context.\"\"\"\n    if not isinstance(api_content, str) or not api_content:\n        return None\n    clean = strip_memory_context_for_replay(api_content)\n    if not clean:\n        return None\n    if isinstance(clean_content, str) and clean.strip() == clean_content.strip():\n        return None\n    return clean\n\n\n"
        },
        {
          "path": "agent/turn_context.py",
          "old": "from agent.memory_manager import build_memory_context_block\n",
          "new": "from agent.memory_manager import (\n    build_memory_context_block,\n    persistable_api_content,\n    strip_memory_context_for_replay,\n)\n"
        },
        {
          "path": "agent/turn_context.py",
          "old": "\n\ndef substitute_api_content(api_msg: Dict[str, Any]) -> Optional[str]:\n",
          "new": "\n\ndef compose_persistable_user_api_content(\n    content: str,\n    ext_prefetch_cache: Optional[str],\n    plugin_user_context: Optional[str],\n) -> Optional[str]:\n    \"\"\"Compose the live sidecar, then remove recall-only context for storage.\"\"\"\n    composed = compose_user_api_content(\n        content,\n        ext_prefetch_cache,\n        plugin_user_context,\n    )\n    if composed is None:\n        return None\n    return persistable_api_content(composed, content)\n\n\ndef substitute_api_content(api_msg: Dict[str, Any]) -> Optional[str]:\n"
        },
        {
          "path": "run_agent.py",
          "old": "from agent.memory_manager import sanitize_context\n",
          "new": "from agent.memory_manager import (\n    persistable_api_content,\n    sanitize_context,\n    strip_memory_context_for_replay,\n)\n"
