  webui-spec.json: |
    {
      "hunks": [
        {
          "path": "api/models.py",
          "old": "logger = logging.getLogger(__name__)\nCLI_VISIBLE_SESSION_LIMIT = 20\n",
          "new": "logger = logging.getLogger(__name__)\n\n\ndef replay_safe_messages(messages):\n    \"\"\"Copy messages for WebUI persistence without recalled memory context.\"\"\"\n    from agent.memory_manager import persistable_api_content\n\n    safe = []\n    for message in messages or []:\n        if not isinstance(message, dict):\n            safe.append(copy.deepcopy(message))\n            continue\n        projected = copy.deepcopy(message)\n        if \"api_content\" in projected:\n            projected[\"api_content\"] = persistable_api_content(\n                projected.get(\"api_content\"), projected.get(\"content\")\n            )\n        safe.append(projected)\n    return safe\n\n\nCLI_VISIBLE_SESSION_LIMIT = 20\n"
