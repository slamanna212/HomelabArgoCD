apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-memory-sidecar-fix
  namespace: hermes
  annotations:
    hermes.nousresearch.com/description: >-
      Durable source and configuration fix for OpenViking recall sidecars. The
      agent patch keeps recalled context in the live request but strips it from
      replayable SQLite/WebUI sidecars. The WebUI entrypoint patch is applied
      after /apptoo is copied into /app and before server.py starts.
data:
  apply_patch.py: |
    #!/usr/bin/env python3
    """Apply exact, fail-closed source patches from a JSON spec.
    
    Usage: apply_patch.py SOURCE_ROOT SPEC_JSON
    """
    from __future__ import annotations
    
    import json
    import os
    import stat
    import sys
    import tempfile
    from pathlib import Path
    
    
    def _atomic_write_text(target: Path, text: str) -> None:
        """Replace one patched source file without exposing a partial write."""
        mode = stat.S_IMODE(target.stat().st_mode)
        temporary: Path | None = None
        try:
            with tempfile.NamedTemporaryFile(
                "w",
                encoding="utf-8",
                dir=target.parent,
                prefix=f".{target.name}.memory-patch-",
                delete=False,
            ) as handle:
                temporary = Path(handle.name)
                handle.write(text)
                handle.flush()
                os.fsync(handle.fileno())
                os.fchmod(handle.fileno(), mode)
            os.replace(temporary, target)
            temporary = None
        finally:
            if temporary is not None:
                try:
                    temporary.unlink()
                except FileNotFoundError:
                    pass
    
    
    def apply_tree(root: Path, spec_path: Path) -> int:
        try:
            root = root.resolve()
            spec = json.loads(spec_path.read_text(encoding="utf-8"))
            hunks = spec["hunks"]
            if not isinstance(hunks, list) or not hunks:
                raise ValueError("spec.hunks must be a non-empty list")
        except Exception as exc:
            print(f"[memory-patch] invalid spec: {exc}", file=sys.stderr, flush=True)
            return 1
    
        failures = 0
        changed: dict[Path, str] = {}
        for index, hunk in enumerate(hunks, 1):
            try:
                rel = Path(hunk["path"])
                old = hunk["old"]
                new = hunk["new"]
                if rel.is_absolute() or ".." in rel.parts:
                    raise ValueError("patch path escapes source root")
                target = (root / rel).resolve()
                target.relative_to(root)
                if not target.is_file():
                    raise FileNotFoundError(rel)
                text = changed.get(target, target.read_text(encoding="utf-8"))
                if new in text:
                    print(f"[memory-patch] already-applied {rel} hunk {index}/{len(hunks)}", flush=True)
                    changed[target] = text
                    continue
                if old not in text:
                    print(f"[memory-patch] MISMATCH {rel} hunk {index}/{len(hunks)}: anchor not found", file=sys.stderr, flush=True)
                    failures += 1
                    continue
                if text.count(old) != 1:
                    print(f"[memory-patch] MISMATCH {rel} hunk {index}/{len(hunks)}: anchor appears {text.count(old)} times", file=sys.stderr, flush=True)
                    failures += 1
                    continue
                changed[target] = text.replace(old, new, 1)
                print(f"[memory-patch] applied {rel} hunk {index}/{len(hunks)}", flush=True)
            except Exception as exc:
                print(f"[memory-patch] MISMATCH hunk {index}/{len(hunks)}: {exc}", file=sys.stderr, flush=True)
                failures += 1
    
        if failures:
            return 2
        for target, text in changed.items():
            if text != target.read_text(encoding="utf-8"):
                _atomic_write_text(target, text)
        return 0
    
    
    def main() -> int:
        if len(sys.argv) != 3:
            print(__doc__, file=sys.stderr)
            return 1
        return apply_tree(Path(sys.argv[1]), Path(sys.argv[2]))
    
    
    if __name__ == "__main__":
        raise SystemExit(main())
  apply_memory_config.py: |
    #!/usr/bin/env python3
    """Idempotently enforce the hot/cold memory contract on the Hermes PVC.

    Hot layer = MEMORY.md/USER.md (always-on rules, injected verbatim, no retrieval).
    Cold layer = OpenViking (everything retrievable). Re-asserted at every boot so a
    runtime edit cannot silently diverge from the declared contract.
    """
    from __future__ import annotations
    
    import os
    import shutil
    import sys
    import tempfile
    from pathlib import Path
    
    from ruamel.yaml import YAML
    
    BOUNDED = {
        # HOT layer ON (hot/cold contract, 2026-09-24). MEMORY.md/USER.md are the
        # verbatim, zero-retrieval layer for always-on rules; OpenViking is the cold
        # layer for everything retrievable. Disabled 2026-09-14 to bound injection
        # while the recall-sidecar bug existed; that bug is fixed by the agent patch
        # in this file, and leaving it off meant the files were still curated weekly
        # and alerted on while being read by nobody.
        # Verify with: grep -c 'MEMORY (your personal notes)' <request dump>.
        "memory_enabled": True,
        "user_profile_enabled": True,
        "provider": "openviking",
        "openviking": {
            "recall_limit": 3,
            # 0.35 let events/ run-log chatlogs and .abstract/.overview stubs
            # outrank the short preference files that answer the query (4 of the
            # top 5 hits). 0.6 is a blunt stopgap until upstream offers an
            # exclusion knob — requested in NousResearch/hermes-agent#121900.
            "recall_score_threshold": 0.6,
            "recall_max_injected_chars": 1800,
            # 800 elided 19 of 25 profile bullets (head+tail truncation), and the
            # elided middle is where the style/verification rules live; 3000 fits a
            # curated profile whole. Plugin defaults are 6000 / 4.0 / 3.0.
            "profile_token_budget": 3000,
            # 1.5s sits below the store's real latency: 2 of 3 probes timed out and
            # the turn silently received NO recall, logged at DEBUG only.
            "recall_timeout_seconds": 4.0,
            "recall_request_timeout_seconds": 3.0,
            "recall_full_read_limit": 1,
            "recall_prefer_abstract": True,
            "recall_resources": False,
        },
    }
    
    
    def main() -> int:
        if len(sys.argv) != 2:
            print("usage: apply_memory_config.py CONFIG_PATH", file=sys.stderr)
            return 1
        path = Path(sys.argv[1])
        if not path.is_file():
            print(f"[memory-config] missing config: {path}", file=sys.stderr, flush=True)
            return 1
    
        yaml = YAML()
        yaml.preserve_quotes = True
        try:
            with path.open("r", encoding="utf-8") as handle:
                data = yaml.load(handle)
        except Exception as exc:
            print(f"[memory-config] cannot parse config: {type(exc).__name__}", file=sys.stderr, flush=True)
            return 2
        if not isinstance(data, dict):
            print("[memory-config] config root is not a mapping", file=sys.stderr, flush=True)
            return 2
    
        memory = data.get("memory")
        if memory is None:
            memory = {}
            data["memory"] = memory
        if not isinstance(memory, dict):
            print("[memory-config] memory section is not a mapping", file=sys.stderr, flush=True)
            return 2
    
        changed = []
        for key in ("memory_enabled", "user_profile_enabled", "provider"):
            if memory.get(key) != BOUNDED[key]:
                memory[key] = BOUNDED[key]
                changed.append(f"memory.{key}")
        openviking = memory.get("openviking")
        if openviking is None:
            openviking = {}
            memory["openviking"] = openviking
        if not isinstance(openviking, dict):
            print("[memory-config] memory.openviking is not a mapping", file=sys.stderr, flush=True)
            return 2
        for key, value in BOUNDED["openviking"].items():
            if openviking.get(key) != value:
                openviking[key] = value
                changed.append(f"memory.openviking.{key}")
    
        if not changed:
            print("[memory-config] already bounded", flush=True)
            return 0
    
        backup = path.with_name(path.name + ".memory-sidecar-fix.bak")
        try:
            original_stat = path.stat()
            if not backup.exists():
                shutil.copy2(path, backup)
                try:
                    os.chown(backup, original_stat.st_uid, original_stat.st_gid)
                except PermissionError:
                    pass
            mode = original_stat.st_mode & 0o777
            with tempfile.NamedTemporaryFile(
                "w", encoding="utf-8", dir=path.parent, prefix=".memory-config-", delete=False
            ) as handle:
                temporary = Path(handle.name)
                yaml.dump(data, handle)
                handle.flush()
                os.fchmod(handle.fileno(), mode or 0o600)
                try:
                    os.fchown(handle.fileno(), original_stat.st_uid, original_stat.st_gid)
                except PermissionError:
                    pass
            os.replace(temporary, path)
        except Exception as exc:
            try:
                if "temporary" in locals() and temporary.exists():
                    temporary.unlink()
            except OSError:
                pass
            print(f"[memory-config] write failed: {type(exc).__name__}", file=sys.stderr, flush=True)
            return 3
    
        print(f"[memory-config] updated {len(changed)} bounded settings; backup={backup.name}", flush=True)
        return 0
    
    
    if __name__ == "__main__":
        raise SystemExit(main())
  patch_webui_entrypoint.py: |
    #!/usr/bin/env python3
    """Insert the durable WebUI source patch into the upstream init script."""
    from __future__ import annotations
    
    import sys
    from pathlib import Path
    
    MARKER = 'echo ""; echo "== Running hermes-webui"\n'
    INJECTION = '''echo ""; echo "== Applying durable Hermes memory sidecar fix"
    python3 /memory-patches/apply_patch.py /app /memory-patches/webui-spec.json || error_exit "Hermes memory sidecar patch failed"
    
    '''
    
    
    def main() -> int:
        if len(sys.argv) != 2:
            print("usage: patch_webui_entrypoint.py INIT_SCRIPT", file=sys.stderr)
            return 1
        path = Path(sys.argv[1])
        text = path.read_text(encoding="utf-8")
        if INJECTION in text:
            print("[memory-patch] WebUI init wrapper already contains the patch hook", flush=True)
            return 0
        if text.count(MARKER) != 1:
            print("[memory-patch] WebUI init marker missing or not unique", file=sys.stderr, flush=True)
            return 2
        path.write_text(text.replace(MARKER, INJECTION + MARKER, 1), encoding="utf-8")
        print("[memory-patch] inserted WebUI patch hook", flush=True)
        return 0
    
    
    if __name__ == "__main__":
        raise SystemExit(main())
  webui-entrypoint.sh: |
    #!/bin/bash
    set -eu
    umask 077
    
    staged=/app/.hermeswebui_init_memory_sidecar.bash
    cp /hermeswebui_init.bash "$staged"
    chmod 0755 "$staged"
    python3 /memory-patches/patch_webui_entrypoint.py "$staged"
    exec "$staged"
