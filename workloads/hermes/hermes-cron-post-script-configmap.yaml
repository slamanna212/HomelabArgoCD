        },
        {
          "new": "            if should_deliver:\n                # Completion hook: runs synchronously with the final response,\n                # after generation and before optional native platform delivery.\n                # This is deliberately NOT a second cron job and never scans\n                # saved output files, so it is completion-coupled with no race.\n                post_script = job.get(\"post_script\")\n                if success and isinstance(post_script, str) and post_script.strip():\n                    hook_ok, hook_output = _run_post_script(\n                        post_script.strip(),\n                        final_response,\n                        {\n                            \"HERMES_CRON_JOB_ID\": str(job[\"id\"]),\n                            \"HERMES_CRON_JOB_NAME\": str(job.get(\"name\", \"\")),\n                            \"HERMES_CRON_STATUS\": \"success\",\n                        },\n                        workdir=(job.get(\"workdir\") or \"\").strip() or None,\n                    )\n                    if not hook_ok:\n                        delivery_error = hook_output\n                        logger.error(\"Post script failed for job %s: %s\", job[\"id\"], hook_output)\n                    else:\n                        logger.info(\"Post script completed for job %s\", job[\"id\"])\n\n                if delivery_error is None:\n                    unresolved_origin = (\n                        _normalize_deliver_value(job.get(\"deliver\", \"local\")) == \"origin\"\n                        and not _resolve_delivery_targets(job)\n                    )\n                    try:\n                        delivery_error = _deliver_result(job, deliver_content, adapters=adapters, loop=loop)\n                    except Exception as de:\n                        delivery_error = str(de)\n                        logger.error(\"Delivery failed for job %s: %s\", job[\"id\"], de)\n",
          "old": "            if should_deliver:\n                unresolved_origin = (\n                    _normalize_deliver_value(job.get(\"deliver\", \"local\")) == \"origin\"\n                    and not _resolve_delivery_targets(job)\n                )\n                try:\n                    delivery_error = _deliver_result(job, deliver_content, adapters=adapters, loop=loop)\n                except Exception as de:\n                    delivery_error = str(de)\n                    logger.error(\"Delivery failed for job %s: %s\", job[\"id\"], de)\n",
          "path": "cron/scheduler.py"
        },
        {
