          "path": "cron/jobs.py"
        },
        {
          "new": "        script: Optional path to a pre-run script whose stdout feeds the job. With\n                ``no_agent=True`` the script IS the job \u2014 its stdout is\n                delivered verbatim. Without ``no_agent``, its stdout is\n                injected into the agent's prompt as context.\n        post_script: Optional path to a completion hook under ~/.hermes/scripts/.\n                It runs after a successful non-silent agent response, receives\n                that final response on stdin, and a small non-secret metadata\n                environment. A non-zero exit records delivery failure.\n",
          "old": "        script: Optional path to a script whose stdout feeds the job. With\n                ``no_agent=True`` the script IS the job \u2014 its stdout is\n                delivered verbatim. Without ``no_agent``, its stdout is\n                injected into the agent's prompt as context (data-collection /\n                change-detection pattern). Paths resolve under\n                ~/.hermes/scripts/; ``.sh`` / ``.bash`` files run via bash,\n                anything else via Python.\n",
