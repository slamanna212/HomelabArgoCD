apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: hermes
  annotations:
    metallb.universe.tf/loadBalancerIPs: 10.1.20.205
    kube-vip.io/ignore: "true"
spec:
  type: LoadBalancer
  selector:
    app: hermes
  ports:
    - name: http
      port: 8787
      targetPort: http
      protocol: TCP
    - name: dashboard
      port: 9119
      targetPort: dashboard
      protocol: TCP
