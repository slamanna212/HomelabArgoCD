apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes
data:
  # SEED ONLY. The seed-config initContainer copies this to $HERMES_HOME/config.yaml
  # exactly once — only if the file does not already exist on the PVC. Hermes rewrites
  # its own config at runtime (switching models from the WebUI, onboarding, skill
  # settings), so overwriting on every restart would silently revert whatever you did
  # in the app. Editing this ConfigMap therefore does NOT change a running install.
  #
  # It matters for exactly two things: a fresh install, and disaster recovery. Keep it
  # in sync with the intended canonical stack, or a rebuilt pod comes up on a model
  # route nobody chose. The LIVE stack is whatever is on the PVC — read it with
  # `/app/venv/bin/hermes config get model` and `hermes fallback list` in the pod.
  #
  # To force a reseed after changing this file:
  #   kubectl -n hermes scale deploy/hermes --replicas=0
  #   kubectl -n hermes debug ... (or exec a temp pod) and delete /opt/data/home/config.yaml
  #   kubectl -n hermes scale deploy/hermes --replicas=1
  # Or just edit the live config from the WebUI, which is usually what you want.
  config.yaml: |
    # Required. Without it Hermes reads this as a pre-v12 config (~2 years old),
    # refuses to auto-migrate it, and falls back to its own defaults — so every
    # setting below is silently ignored, including allow_private_urls. The agent
    # logs "[config-migrate] WARNING: This config predates version 12" when this
    # is missing. Bump this only against the upstream config changelog.
    #
    # 39 matches the running install (Hermes v0.21.0). A stale value is not fatal
    # (Hermes migrates it forward), but it must never be < 12.
    _config_version: 39

    model:
      # Direct DeepSeek. `deepseek-flash` is DeepSeek's OWN canonical name for
      # V4.1-Flash: /v1/models lists only `deepseek-flash` and `deepseek-v4-pro`,
      # and a literal `deepseek-v4.1-flash` is rejected by the API. Hermes
      # normalizes `deepseek-flash` to the wire id `deepseek-v4-flash` at session
      # setup, which also satisfies the provider profile's thinking gate (that gate
      # requires a `deepseek-v` prefix; see plugins/model-providers/deepseek).
      # This model accepts image input, so image routing resolves to "native" and
      # no auxiliary vision model is needed.
      default: deepseek-flash
      provider: deepseek
      base_url: https://api.deepseek.com/v1
      aliases:
        reason: openrouter/z-ai/glm-5.3-flash
        deepseek-pro: deepseek/deepseek-v4-pro
        deepseek-pro-openrouter: openrouter/deepseek/deepseek-v4-pro-0813

    # Ordered failover when the primary is exhausted (rate-limit, overload,
    # connection failure): DeepSeek direct -> DeepSeek via OpenRouter ->
    # GPT-5.6 Luna on the Codex subscription. Entry 1 is intentionally the same
    # route as the primary (a direct retry); the chain is not pruned against the
    # primary at init, so it does fire. Keep one vendor per tier — a chain whose
    # entries all resolve to one vendor collapses when that vendor is down.
    fallback_providers:
      - provider: deepseek
        model: deepseek-flash
      - provider: openrouter
        model: deepseek/deepseek-v4.1-flash
      - provider: openai-codex
        model: gpt-5.6-luna

    agent:
      max_turns: 90
      gateway_timeout: 1800
      restart_drain_timeout: 60
      tool_use_enforcement: auto
      # Per-model thinking-effort pins. Keep this list SHORT: anything not listed
      # runs at its own provider default (agent.reasoning_effort is deliberately
      # unset). Keys are model ids — a renamed id silently detaches its pin.
      reasoning_overrides:
        gpt-5.6-luna: max

    auxiliary:
      # Cheap side task — ranking/assembly only. `minimal` clamps to DeepSeek's
      # lowest supported effort (low). Do not raise it: DeepSeek reasoning tokens
      # bill against max_tokens, and a thinking title call can hit finish_reason
      # =length and return EMPTY content.
      title_generation:
        provider: deepseek
        model: deepseek-flash
        reasoning_effort: minimal

    terminal:
      # Shell commands run inside this pod's own container.
      backend: local
      cwd: /workspace
      timeout: 180
    display:
      tool_progress: all
      interim_assistant_messages: true
    browser:
      inactivity_timeout: 120
      command_timeout: 30
      # Keep the agent's browser off RFC1918 addresses. This pod sits on the cluster
      # network with reach into the rest of the LAN; flipping this to true lets the
      # agent browse your internal admin UIs.
      allow_private_urls: false
    compression:
      enabled: true
      threshold: 0.5
      target_ratio: 0.2
      protect_last_n: 20
    # OpenViking is the canonical memory provider. Built-in file injection is
    # disabled to avoid duplicate MEMORY.md/USER.md prompt payloads.
    memory:
      memory_enabled: false
      user_profile_enabled: false
      provider: openviking
      openviking:
        recall_limit: 3
        recall_score_threshold: 0.35
        recall_max_injected_chars: 1800
        profile_token_budget: 800
        recall_timeout_seconds: 2.0
        recall_request_timeout_seconds: 1.5
        recall_full_read_limit: 1
        recall_prefer_abstract: true
        recall_resources: false
    security:
      redact_secrets: true
      tirith_enabled: true
      tirith_fail_open: true
    mcp_servers:
      todoist:
        command: /opt/hermes-todoist/todoist_mcp_launcher.sh
        args:
          - /opt/hermes-todoist/todoist_mcp.py
        connect_timeout: 60
        enabled: true
