apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-secrets
  namespace: hermes
  annotations:
    force-sync: "2026-08-14T12:27:51Z"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: hermes-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: openrouter-api-key
      remoteRef:
        key: hermes-openrouter-api-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: discord-bot-token
      remoteRef:
        key: hermes-discord-bot-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: deepseek-api-key
      remoteRef:
        key: hermes-deepseek-api-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: api-server-key
      remoteRef:
        key: hermes-api-server-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: webui-password
      remoteRef:
        key: hermes-webui-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
