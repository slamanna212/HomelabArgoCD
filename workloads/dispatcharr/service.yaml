apiVersion: v1
kind: Service
metadata:
  name: dispatcharr
  namespace: dispatcharr
  annotations:
    metallb.universe.tf/loadBalancerIPs: 10.1.20.202
    kube-vip.io/ignore: "true"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: dispatcharr
    component: web
  ports:
    - name: http
      appProtocol: kubernetes.io/ws
      port: 9191
      targetPort: 9191
      protocol: TCP
