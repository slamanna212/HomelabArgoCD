apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcharr-web
  namespace: dispatcharr
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: dispatcharr
      component: web
  template:
    metadata:
      labels:
        app: dispatcharr
        component: web
    spec:
      initContainers:
        - name: gluetun
          restartPolicy: Always
          # Pinned to a release. Untagged resolves to :latest, which makes Kubernetes
          # default imagePullPolicy to Always — so every pod restart silently pulled a
          # master build, invisible to this repo and to Renovate. HEALTH_RESTART_VPN
          # below exists as of v3.41.0, so a stable tag keeps that fix.
          image: qmcgaw/gluetun:v3.41.3
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
          env:
            # `custom` rather than `mullvad` on purpose — see the SERVER_HOSTNAMES note below.
            # The endpoint is pinned explicitly, so gluetun's embedded server list is not
            # consulted at all and cannot pick a stale hostname or an IPv6 address.
            - name: VPN_SERVICE_PROVIDER
              value: "custom"
            - name: VPN_TYPE
              value: "wireguard"
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: dispatcharr-vpn-secret
                  key: wireguard-private-key
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: dispatcharr-vpn-secret
                  key: wireguard-addresses
            # us-qas-wg-306 — Ashburn, VA, Tzulo, 20 Gbps. Endpoint pinned by IP because
            # SERVER_HOSTNAMES took Dispatcharr down twice on 2026-08-11:
            #
            #   1. gluetun v3.41.3's embedded server list does not contain us-qas-wg-306, so
            #      it hard-failed at startup ("the hostname specified is not valid") and the
            #      killswitch kept the whole pod down. The server is live — Mullvad's API
            #      lists it active — the *image's* list is stale. It worked before the image
            #      was pinned only because untagged `:latest` pulled master builds with a
            #      fresher list; pinning froze the server list along with the code.
            #   2. us-qas-wg-203 IS in that list, but gluetun selected its IPv6 endpoint
            #      [2a01:4740:1::f201]:51820. This cluster is IPv4 only, so every dial timed
            #      out and the tunnel never came up.
            #
            # Pinning IP + port + public key sidesteps both: no list lookup, no address-family
            # choice. Values from https://api.mullvad.net/www/relays/wireguard/ — re-check
            # there if Mullvad ever rotates this relay's key or address.
            #
            # 23.234.98.127 is also deliberately NOT 23.234.85.2 (ca-tor-wg-203), which is the
            # endpoint the UniFi gateway's own wgclt1 uses. See the T0 section of
            # docs/dispatcharr-buffering-runbook.md.
            - name: WIREGUARD_ENDPOINT_IP
              value: "23.234.98.127"
            - name: WIREGUARD_ENDPOINT_PORT
              value: "51820"
            - name: WIREGUARD_PUBLIC_KEY
              value: "5J/CzkztJt5djDo/UiHA0jQwMOr5b7SfeY77TWmcVF0="
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.0.0.0/8,10.96.0.0/12"
            # WireGuard sends no keepalives by default, so an idle tunnel emits nothing.
            # The UniFi gateway ages an offloaded UDP flow out of its fastpath after
            # nf_flowtable_udp_timeout (default 30 s) of inactivity, and hands it back to
            # conntrack with another 30 s pickup window. 15 s guarantees the flow is never
            # idle long enough to be aged or re-bound. This does NOT explain the 2026-08-11
            # load-test wedge (that flow was saturated, not idle) — it closes the separate
            # idle-aging hole, cheaply and with no downside.
            - name: WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL
              value: "15s"
            - name: HEALTH_SERVER_ADDRESS
              value: "0.0.0.0:9999"
            # Re-enabled 2026-09-01. The original off rationale (checks starve under load,
            # restarts cause buffering) was retired the next day by d70375f: tcpdump showed
            # the tunnel genuinely blackholed, restarts were a response, not the cause. The
            # UniFi-specific triggers (nf_flowtable offload, wgclt1 collision) are gone with
            # the router (OPNsense since 08-19), and on 2026-09-01 an OPNsense reboot killed
            # the flow with no self-heal for 2h10m until manual pod recycle. On: a dead
            # tunnel re-establishes on a new source port after the check window. See
            # CLAUDE.md for the full history.
            - name: HEALTH_RESTART_VPN
              value: "on"
            # Leave DNS to CoreDNS. gluetun defaults to DOT=on and rewrites
            # /etc/resolv.conf to its own DoT proxy on 127.0.0.1:53, which resolves via
            # Cloudflare *through the tunnel*. kubelet bind-mounts ONE resolv.conf into
            # every container in a pod, so that rewrite captured the dispatcharr
            # container too — every provider lookup depended on tunnel state, and any
            # tunnel blip became "Temporary failure in name resolution" and a dead
            # stream. It also bypassed the network-level DNS policy entirely and ran
            # gluetun's malicious-domain blocklist against provider hostnames.
            - name: DOT
              value: "off"
            - name: DNS_KEEP_NAMESERVER
              value: "on"
            - name: FIREWALL_INPUT_PORTS
              value: "9999,9191,9192"
          startupProbe:
            httpGet:
              path: /
              port: 9999
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z dispatcharr-postgresql 5432; do echo waiting for postgres; sleep 2; done"]
        - name: wait-for-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z dispatcharr-redis-master 6379; do echo waiting for redis; sleep 2; done"]
      containers:
        - name: dispatcharr
          image: ghcr.io/dispatcharr/dispatcharr:0.30.0
          ports:
            - containerPort: 9191
          env:
            - name: DISPATCHARR_ENV
              value: "modular"
            - name: DISPATCHARR_PORT
              value: "9191"
            - name: DISPATCHARR_WEB_HOST
              value: "dispatcharr"
            - name: POSTGRES_HOST
              value: "dispatcharr-postgresql"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "dispatcharr"
            - name: POSTGRES_USER
              value: "dispatcharr"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dispatcharr-postgres-secret
                  key: postgres-password
            - name: REDIS_HOST
              value: "dispatcharr-redis-master"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_DB
              value: "0"
            - name: DJANGO_SETTINGS_MODULE
              value: "dispatcharr.settings"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DISPATCHARR_LOG_LEVEL
              value: "info"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dispatcharr-app-secret
                  key: secret-key
          volumeMounts:
            - name: data
              mountPath: /data
            - name: recordings
              mountPath: /data/recordings
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /api/core/version/
              port: 9191
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/core/version/
              port: 9191
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 2Gi
              cpu: 2000m
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dispatcharr-data
        - name: recordings
          persistentVolumeClaim:
            claimName: dispatcharr-recordings
        - name: tmp
          emptyDir: {}
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
