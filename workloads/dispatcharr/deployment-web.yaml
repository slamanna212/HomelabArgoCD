apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcharr-web
  namespace: dispatcharr
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: dispatcharr
      component: web
  template:
    metadata:
      labels:
        app: dispatcharr
        component: web
    spec:
      initContainers:
        - name: gluetun
          restartPolicy: Always
          # Pinned to a release. Untagged resolves to :latest, which makes Kubernetes
          # default imagePullPolicy to Always — so every pod restart silently pulled a
          # master build, invisible to this repo and to Renovate. HEALTH_RESTART_VPN
          # below exists as of v3.41.0, so a stable tag keeps that fix.
          image: qmcgaw/gluetun:v3.41.3
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
          env:
            - name: VPN_SERVICE_PROVIDER
              value: "mullvad"
            - name: VPN_TYPE
              value: "wireguard"
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: dispatcharr-vpn-secret
                  key: wireguard-private-key
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: dispatcharr-vpn-secret
                  key: wireguard-addresses
            # Back to the Ashburn default 2026-08-11. This is also an active experiment:
            # `ca-tor-wg-203` resolves to 23.234.85.2:51820, which is the exact endpoint the
            # UniFi gateway's own WireGuard client (`wgclt1`) uses, so every freeze reproduced
            # so far ran with two WireGuard flows to one peer through one box — one locally
            # terminated, one NATed. Moving off that endpoint tests whether the collision
            # matters. See the T0 section of docs/dispatcharr-buffering-runbook.md.
            # Two ways this field takes Dispatcharr down, both hit on 2026-08-11:
            #
            #   1. A hostname absent from the server list embedded in gluetun v3.41.3 —
            #      gluetun hard-fails at startup ("the hostname specified is not valid") and
            #      the killswitch keeps the pod down. `us-qas-wg-306` is such a hostname now:
            #      it worked before the image was pinned only because untagged `:latest`
            #      pulled master builds with a fresher list. Pinning froze the server list
            #      along with the code. Valid Ashburn names for v3.41.3 are
            #      us-qas-wg-001/002/003/004, -101/102/103, -201/202/203/204.
            #   2. A hostname whose selected endpoint is IPv6. `us-qas-wg-203` resolved to
            #      [2a01:4740:1::f201]:51820 and every dial timed out — this cluster is IPv4
            #      only. Check the "[wireguard] Connecting to" log line after any change.
            #
            # `ca-tor-wg-203` is IPv4 (23.234.85.2) and known-good on this image.
            - name: SERVER_HOSTNAMES
              value: "ca-tor-wg-203"
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.0.0.0/8,10.96.0.0/12"
            # WireGuard sends no keepalives by default, so an idle tunnel emits nothing.
            # The UniFi gateway ages an offloaded UDP flow out of its fastpath after
            # nf_flowtable_udp_timeout (default 30 s) of inactivity, and hands it back to
            # conntrack with another 30 s pickup window. 15 s guarantees the flow is never
            # idle long enough to be aged or re-bound. This does NOT explain the 2026-08-11
            # load-test wedge (that flow was saturated, not idle) — it closes the separate
            # idle-aging hole, cheaply and with no downside.
            - name: WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL
              value: "15s"
            - name: HEALTH_SERVER_ADDRESS
              value: "0.0.0.0:9999"
            # Do NOT re-enable without reading the note in CLAUDE.md. gluetun's health
            # checks (TCP+TLS dial every 5m, ICMP ping every 1m) time out when live
            # streaming saturates the tunnel, and the "cure" is to tear the tunnel down —
            # which kills every in-flight provider connection and causes the buffering it
            # was reacting to. Checks still run and still log with this off; only the
            # destructive restart is disabled.
            - name: HEALTH_RESTART_VPN
              value: "off"
            # Leave DNS to CoreDNS. gluetun defaults to DOT=on and rewrites
            # /etc/resolv.conf to its own DoT proxy on 127.0.0.1:53, which resolves via
            # Cloudflare *through the tunnel*. kubelet bind-mounts ONE resolv.conf into
            # every container in a pod, so that rewrite captured the dispatcharr
            # container too — every provider lookup depended on tunnel state, and any
            # tunnel blip became "Temporary failure in name resolution" and a dead
            # stream. It also bypassed the network-level DNS policy entirely and ran
            # gluetun's malicious-domain blocklist against provider hostnames.
            - name: DOT
              value: "off"
            - name: DNS_KEEP_NAMESERVER
              value: "on"
            - name: FIREWALL_INPUT_PORTS
              value: "9999,9191,9192"
          startupProbe:
            httpGet:
              path: /
              port: 9999
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z dispatcharr-postgresql 5432; do echo waiting for postgres; sleep 2; done"]
        - name: wait-for-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z dispatcharr-redis-master 6379; do echo waiting for redis; sleep 2; done"]
      containers:
        - name: dispatcharr
          image: ghcr.io/dispatcharr/dispatcharr:0.29.0
          ports:
            - containerPort: 9191
          env:
            - name: DISPATCHARR_ENV
              value: "modular"
            - name: DISPATCHARR_PORT
              value: "9191"
            - name: DISPATCHARR_WEB_HOST
              value: "dispatcharr"
            - name: POSTGRES_HOST
              value: "dispatcharr-postgresql"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "dispatcharr"
            - name: POSTGRES_USER
              value: "dispatcharr"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dispatcharr-postgres-secret
                  key: postgres-password
            - name: REDIS_HOST
              value: "dispatcharr-redis-master"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_DB
              value: "0"
            - name: DJANGO_SETTINGS_MODULE
              value: "dispatcharr.settings"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DISPATCHARR_LOG_LEVEL
              value: "info"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dispatcharr-app-secret
                  key: secret-key
          volumeMounts:
            - name: data
              mountPath: /data
            - name: recordings
              mountPath: /data/recordings
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /api/core/version/
              port: 9191
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/core/version/
              port: 9191
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 2Gi
              cpu: 2000m
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dispatcharr-data
        - name: recordings
          persistentVolumeClaim:
            claimName: dispatcharr-recordings
        - name: tmp
          emptyDir: {}
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
