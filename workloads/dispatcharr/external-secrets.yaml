---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dispatcharr-vpn-secret
  namespace: dispatcharr
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: dispatcharr-vpn-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Renamed 2026-08-11. The originals (dispatcharr-vpn-wireguard-private-key /
    # dispatcharr-vpn-wireguard-address) were deleted in the Azure portal during a
    # rekey. Key Vault soft-delete is on by default and cannot be turned off, so a
    # deleted secret keeps its name for the 90-day retention window — it vanishes from
    # the Secrets list while still blocking recreation under the same name. Rather than
    # recover them, the rekey moved to fresh names. Do not rename these back until the
    # old ones age out or are purged.
    - secretKey: wireguard-private-key
      remoteRef:
        key: dispatcharr-wg-private-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: wireguard-addresses
      remoteRef:
        key: dispatcharr-wg-address
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
