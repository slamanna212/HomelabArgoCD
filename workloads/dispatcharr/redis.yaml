apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcharr-redis
  namespace: dispatcharr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dispatcharr
      component: redis
  template:
    metadata:
      labels:
        app: dispatcharr
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
---
apiVersion: v1
kind: Service
metadata:
  name: dispatcharr-redis-master
  namespace: dispatcharr
spec:
  selector:
    app: dispatcharr
    component: redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
